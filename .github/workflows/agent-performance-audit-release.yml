name: Performance audit release v4

on:
  push:
    branches:
      - agent/performance-audit-03
    paths:
      - .github/workflows/agent-performance-audit-release.yml
      - .github/scripts/apply_performance_audit.py
      - .github/audit/trigger-performance-audit-v4

permissions:
  contents: write

concurrency:
  group: leopardwm-performance-audit-v4
  cancel-in-progress: false

jobs:
  optimize-test-release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: v0.2.6-sehoon.4
      RELEASE_VERSION: 0.2.6-sehoon.4
      BASELINE_DAEMON_BYTES: 9157632
      BASELINE_CLI_BYTES: 1998336
      BASELINE_WATCHDOG_BYTES: 1771520

    steps:
      - name: Check out performance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/performance-audit-03
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy,rustfmt

      - name: Apply performance and maintainability pass
        run: python .github/scripts/apply_performance_audit.py

      - name: Qualify thin-wrapper return types
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('crates/cli/src/main.rs', 'crates/cli/src/bin/lwm.rs')) {
            $text = Get-Content -Raw -Encoding utf8 $path
            $text = [regex]::Replace($text, '->\s*Result<', '-> anyhow::Result<')
            $text = [regex]::Replace($text, '->\s*ExitCode\b', '-> std::process::ExitCode')
            [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          }

      - name: Refresh lockfile for direct allocation dependency
        run: cargo check -p leopardwm-core-layout

      - name: Format source
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run complete locked test suite
        run: cargo test --all --locked

      - name: Run optimized core-layout tests
        run: cargo test --release -p leopardwm-core-layout --locked

      - name: Run Clippy on every target and feature
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check every target and feature
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Build optimized Windows binaries
        run: cargo build --release --workspace --locked

      - name: Verify GUI executable subsystems
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1

      - name: Record binary size comparison
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = 'target/x86_64-pc-windows-msvc/release'
          $rows = @(
            @{ Name = 'leopardwm.exe'; Baseline = [int64]$env:BASELINE_DAEMON_BYTES },
            @{ Name = 'leopardwm-cli.exe'; Baseline = [int64]$env:BASELINE_CLI_BYTES },
            @{ Name = 'lwm.exe'; Baseline = [int64]$env:BASELINE_CLI_BYTES },
            @{ Name = 'leopardwm-watchdog.exe'; Baseline = [int64]$env:BASELINE_WATCHDOG_BYTES }
          )
          $lines = @('', '## Optimized binary-size comparison', '', '| Binary | v0.2.6-sehoon.3 | This pass | Delta |', '|---|---:|---:|---:|')
          foreach ($row in $rows) {
            $current = (Get-Item "$binDir/$($row.Name)").Length
            $delta = $current - $row.Baseline
            $sign = if ($delta -gt 0) { '+' } else { '' }
            $lines += "| ``$($row.Name)`` | $($row.Baseline) B | $current B | $sign$delta B |"
          }
          $lines += @('', 'Binary size is tracked as an engineering signal, not used as a proxy for runtime latency.')
          Add-Content -Encoding utf8 agent_docs/sehoon-fork-performance-audit.md $lines
          Get-Content agent_docs/sehoon-fork-performance-audit.md | Select-Object -Last 12

      - name: Ensure the source diff is intentional
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          git status --short
          $changed = @(git diff --name-only)
          if ($changed.Count -lt 8) {
            throw "Expected a structural performance pass; only $($changed.Count) files changed"
          }
          if ($changed -contains 'Cargo.lock') {
            git diff -- Cargo.lock
          }

      - name: Remove one-shot automation and commit verified source
        id: source_commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $oneShotFiles = @(
            '.github/workflows/agent-performance-audit-release.yml',
            '.github/workflows/agent-export-performance-source.yml',
            '.github/workflows/agent-export-patch.yml',
            '.github/workflows/agent-full-audit-release.yml',
            '.github/scripts/apply_performance_audit.py',
            '.github/audit/trigger-performance-audit-v4'
          )
          foreach ($path in $oneShotFiles) {
            Remove-Item $path -ErrorAction SilentlyContinue
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: remove hot-path allocations and simplify build targets"
          git push origin HEAD:agent/performance-audit-03
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Package binaries and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = 'target/x86_64-pc-windows-msvc/release'
          $packageDir = "LeopardWM-$env:RELEASE_VERSION-x86_64-windows"
          $zipPath = "$packageDir.zip"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          $binaries = @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')
          foreach ($binary in $binaries) {
            Copy-Item "$binDir/$binary" "$packageDir/$binary"
            Copy-Item "$binDir/$binary" $binary
          }
          Copy-Item README.md, LICENSE, agent_docs/sehoon-fork-code-audit.md, agent_docs/sehoon-fork-performance-audit.md $packageDir
          Compress-Archive -Path $packageDir -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $assets = @($zipPath) + $binaries
          $checksumLines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash *$asset"
          }
          $checksumLines | Set-Content -Encoding ascii checksums.txt
          Get-Content checksums.txt

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          Personal-fork prerelease from `sehoon123/LeopardWM`.

          Production performance pass 3:
          - compiles the CLI implementation once and keeps both executable names as thin wrappers
          - moves the embedded Settings document into a native HTML asset
          - preallocates final layout output from exact workspace cardinality
          - keeps common per-column layout scratch arrays inline with SmallVec
          - preallocates daemon placement/drag scratch outputs where an exact upper bound exists
          - preserves all event ordering and timing semantics
          - removes stale one-shot agent workflows from the shipping source tree

          Release gate completed before publication:
          - formatting check
          - complete locked test suite
          - optimized core-layout test suite
          - Clippy over every target and feature with warnings denied
          - every-target/every-feature Cargo check
          - optimized Windows workspace build
          - PE GUI-subsystem verification

          The package includes `agent_docs/sehoon-fork-performance-audit.md` with the exact scope and binary-size comparison. Nothing was sent upstream.
          '@ | Set-Content -Encoding utf8 release-notes.md

      - name: Publish verified binaries to this fork
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          gh release create $env:RELEASE_TAG `
            "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip" `
            leopardwm.exe `
            leopardwm-cli.exe `
            lwm.exe `
            leopardwm-watchdog.exe `
            checksums.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SOURCE_SHA `
            --title "LeopardWM $env:RELEASE_TAG — production performance pass 3" `
            --notes-file release-notes.md `
            --prerelease
