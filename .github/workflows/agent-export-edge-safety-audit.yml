name: Export edge safety audit source

on:
  push:
    branches:
      - agent/edge-safety-audit-v9
    paths:
      - .github/workflows/agent-export-edge-safety-audit.yml

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed48603d6417a3f2e5af846e1182cbb7aee5cea5
          fetch-depth: 0
      - name: Archive exact main source
        run: git archive --format=zip --output=LeopardWM-edge-safety-audit-source.zip HEAD
      - name: Upload source archive
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: LeopardWM-edge-safety-audit-source
          path: LeopardWM-edge-safety-audit-source.zip
          if-no-files-found: error
          retention-days: 2
      - name: Record artifact coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          path='agent_docs/edge-safety-audit-export.json'
          payload=$(jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg source_sha 'ed48603d6417a3f2e5af846e1182cbb7aee5cea5' \
            '{run_id:$run_id,artifact_id:$artifact_id,artifact_digest:$artifact_digest,source_sha:$source_sha}')
          content=$(printf '%s\n' "$payload" | base64 -w0)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='ci: record edge safety audit source export' \
            -f content="$content" \
            -f branch='agent/edge-safety-audit-v9' >/dev/null
