name: Final feature and MSI release v6

on:
  push:
    branches:
      - agent/release-msi-v6
    paths:
      - .github/workflows/agent-release-msi-v6-final.yml
      - .github/scripts/v6_release.py.part*
      - .github/audit/v6-feature.patch.gz.b64.part*

permissions:
  contents: write

concurrency:
  group: leopardwm-v0.2.6-sehoon.6-final
  cancel-in-progress: false

jobs:
  verify-build-msi-release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out release control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/release-msi-v6
          fetch-depth: 0

      - name: Install stable Rust with quality components
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: Reconstruct and run verified release driver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import os
          root = Path('.github/scripts')
          parts = sorted(root.glob('v6_release.py.part*'))
          if len(parts) != 5:
              raise SystemExit(f'expected 5 script chunks, found {len(parts)}')
          script = ''.join(part.read_text(encoding='utf-8') for part in parts)
          output = Path(os.environ['RUNNER_TEMP'], 'v6_release.py')
          output.write_text(script, encoding='utf-8', newline='\n')
          print(f'reconstructed release driver: {len(script)} characters')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'release driver reconstruction failed' }
          $driver = Join-Path $env:RUNNER_TEMP 'v6_release.py'
          python -m py_compile $driver
          if ($LASTEXITCODE -ne 0) { throw 'release driver syntax check failed' }
          python $driver
          if ($LASTEXITCODE -ne 0) { throw 'release driver failed' }
