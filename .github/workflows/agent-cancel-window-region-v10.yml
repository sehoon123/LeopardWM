name: Cancel superseded window-region v10 run

on:
  push:
    branches:
      - agent/window-region-clipping-v10-control
    paths:
      - .github/workflows/agent-cancel-window-region-v10.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/window-region-clipping-v10-control
      - name: Cancel in-progress validation before final hardening
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(jq -r .run_id agent_docs/window-region-v10-status.json)
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)
          if [[ "$status" != completed ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"
          fi
