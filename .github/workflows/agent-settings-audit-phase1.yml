name: Settings audit phase 1
# Registration bump: GitHub records new branch-only workflows on their first update.

on:
  push:
    branches:
      - agent/settings-resize-audit-01
    paths:
      - .github/workflows/agent-settings-audit-phase1.yml

permissions:
  contents: write

