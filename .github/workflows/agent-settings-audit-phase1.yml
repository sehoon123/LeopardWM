name: Settings audit phase 1

on:
  push:
    branches:
      - agent/settings-resize-audit-01
    paths:
      - .github/workflows/agent-settings-audit-phase1.yml
      - .github/scripts/apply_settings_phase1.py

permissions:
  contents: write

jobs:
  patch-test-build-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v0.2.6-sehoon.2
      RELEASE_VERSION: 0.2.6-sehoon.2

    steps:
      - name: Check out audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/settings-resize-audit-01
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Apply deterministic settings fixes
        run: python .github/scripts/apply_settings_phase1.py

      - name: Format source
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run full test suite
        run: cargo test --all --locked

      - name: Run Clippy with warnings denied
        run: cargo clippy --all --locked -- -D warnings

      - name: Build optimized Windows binaries
        run: cargo build --release --locked

      - name: Verify GUI executable subsystems
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1

      - name: Remove one-shot automation and commit verified source
        id: source_commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item .github/workflows/agent-settings-audit-phase1.yml
          Remove-Item .github/scripts/apply_settings_phase1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/settings/win32.rs crates/daemon/src/settings/mod.rs .github/workflows/agent-settings-audit-phase1.yml .github/scripts/apply_settings_phase1.py
          git commit -m "fix: make settings window resizable and harden lifecycle"
          git push origin HEAD:agent/settings-resize-audit-01
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Package binaries and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = 'target/x86_64-pc-windows-msvc/release'
          $packageDir = "LeopardWM-$env:RELEASE_VERSION-x86_64-windows"
          $zipPath = "$packageDir.zip"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          $binaries = @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')
          foreach ($binary in $binaries) {
            Copy-Item "$binDir/$binary" "$packageDir/$binary"
            Copy-Item "$binDir/$binary" $binary
          }
          Copy-Item README.md, LICENSE $packageDir
          Compress-Archive -Path $packageDir -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $assets = @($zipPath) + $binaries
          $checksumLines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash *$asset"
          }
          $checksumLines | Set-Content -Encoding ascii checksums.txt
          Get-Content checksums.txt

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          Personal-fork prerelease from `sehoon123/LeopardWM`.

          Settings audit phase 1:
          - enables native edge/corner resizing and the maximize button
          - gives the WebView2 host a DPI-aware initial client size
          - enforces a usable DPI-aware minimum size
          - accepts the suggested rectangle across monitors with different DPI
          - focuses an already-open settings window instead of silently doing nothing
          - resets the singleton guard on thread spawn failure or panic unwind
          - orders WebView2, HWND, brush, and icon teardown to avoid leaks and races
          - uses `WS_CLIPCHILDREN` to reduce repaint/flicker during interactive resize

          Validation completed before packaging:
          - `cargo fmt --all -- --check`
          - `cargo test --all --locked`
          - `cargo clippy --all --locked -- -D warnings`
          - `cargo build --release --locked`
          - GUI subsystem verification

          This release exists only in the user fork. Nothing was sent upstream.
          '@ | Set-Content -Encoding utf8 release-notes.md

      - name: Publish tested binaries to this fork
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          gh release create $env:RELEASE_TAG `
            "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip" `
            leopardwm.exe `
            leopardwm-cli.exe `
            lwm.exe `
            leopardwm-watchdog.exe `
            checksums.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SOURCE_SHA `
            --title "LeopardWM $env:RELEASE_TAG — settings resize audit" `
            --notes-file release-notes.md `
            --prerelease
