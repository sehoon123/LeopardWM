name: Finalize v4 branch cleanup

on:
  push:
    branches:
      - agent/performance-audit-03
    paths:
      - .github/workflows/agent-v4-final-cleanup.yml

permissions:
  contents: write

concurrency:
  group: leopardwm-v4-recovery
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/performance-audit-03
          fetch-depth: 0
      - name: Remove transient agent machinery
        run: |
          set -euo pipefail
          rm -f \
            CONTROL.md \
            .github/workflows/agent-performance-audit-release.yml \
            .github/workflows/agent-export-performance-source.yml \
            .github/workflows/agent-export-patch.yml \
            .github/workflows/agent-full-audit-release.yml \
            .github/workflows/agent-v4-release-sentinel.yml \
            .github/workflows/agent-v4-recovery.yml \
            .github/workflows/agent-v4-control.yml \
            .github/workflows/agent-v4-final-cleanup.yml \
            .github/scripts/apply_performance_audit.py \
            .github/audit/trigger-performance-audit-v4 \
            .github/ensure_v4.py \
            .github/recover_v4.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No transient files remain"
          else
            git commit -m "chore: remove transient performance-audit automation"
            git push origin HEAD:agent/performance-audit-03
          fi
