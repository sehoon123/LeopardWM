name: Export current source for engineering audit

on:
  push:
    branches:
      - agent/performance-audit-03
    paths:
      - .github/workflows/agent-export-current-source.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adaptive-smooth-compositor-v7
          fetch-depth: 0
      - name: Archive exact adaptive-v7 working source
        run: git archive --format=zip --output=LeopardWM-adaptive-v7-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: LeopardWM-adaptive-v7-source
          path: LeopardWM-adaptive-v7-source.zip
          if-no-files-found: error
          retention-days: 2
      - name: Publish artifact locator on control branch
        shell: bash
        run: |
          git fetch origin agent/performance-audit-03
          git switch -C agent/performance-audit-03 origin/agent/performance-audit-03
          mkdir -p agent_docs
          printf '{"run_id":%s,"artifact_name":"LeopardWM-adaptive-v7-source","source_sha":"%s"}\n' "$GITHUB_RUN_ID" "$(git rev-parse origin/agent/adaptive-smooth-compositor-v7)" > agent_docs/adaptive-v7-export.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_docs/adaptive-v7-export.json
          git commit -m "chore: record adaptive-v7 export artifact"
          git push origin HEAD:agent/performance-audit-03
