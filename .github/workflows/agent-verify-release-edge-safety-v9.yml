name: Verify and release edge safety v9

on:
  push:
    branches:
      - agent/edge-safety-audit-v9
    paths:
      - .github/workflows/agent-verify-release-edge-safety-v9.yml
      - .github/scripts/apply_edge_safety_product_v9.py

permissions:
  contents: write
  actions: read

concurrency:
  group: verify-release-edge-safety-v9
  cancel-in-progress: false

env:
  SOURCE_BRANCH: agent/edge-safety-fix-v9-source
  CONTROL_BRANCH: agent/edge-safety-audit-v9
  EXPECTED_MAIN_SHA: ed48603d6417a3f2e5af846e1182cbb7aee5cea5
  RELEASE_TAG: v0.2.6-sehoon.9
  RELEASE_VERSION: 0.2.6-sehoon.9

jobs:
  verify-build-release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out control files
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_BRANCH }}
          path: control
          fetch-depth: 0

      - name: Check out candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          path: source
          fetch-depth: 0

      - name: Record workflow coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='agent_docs/edge-safety-v9-status.json'
          payload=$(jq -n \
            --arg state started \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg expected_main "$EXPECTED_MAIN_SHA" \
            '{state:$state,run_id:$run_id,run_url:$run_url,expected_main:$expected_main}')
          content=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CONTROL_BRANCH" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='ci: record edge-safety v9 run' -f content="$content" -f branch="$CONTROL_BRANCH")
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply the focused monitor-isolation fix
        working-directory: source
        run: python ../control/.github/scripts/apply_edge_safety_product_v9.py

      - name: Format and verify the exact change set
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt check failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }

          $allowed = @(
            'crates/daemon/src/layout_apply.rs',
            'crates/daemon/src/layout_apply_edge_tests.rs',
            'crates/core_layout/tests/edge_centering.rs'
          )
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) {
            throw "Unexpected changed files: $($unexpected -join ', ')"
          }

      - name: Verify source and Settings contracts
        working-directory: source
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          layout = Path('crates/daemon/src/layout_apply.rs').read_text(encoding='utf-8')
          settings = Path('crates/daemon/src/settings/settings.html').read_text(encoding='utf-8')
          tests = Path('crates/daemon/src/layout_apply_edge_tests.rs').read_text(encoding='utf-8')

          required_layout = [
              'pub(crate) fn park_offscreen_avoiding_neighbors(',
              'focused_column: Option<usize>',
              'clamp_horizontally_inside(placement.rect, owner.work_area)',
              '(*monitor_id == self.focused_monitor)',
              'never pin an old workspace back on-screen',
              'mod edge_safety_audit_tests;',
          ]
          missing = [marker for marker in required_layout if marker not in layout]
          if missing:
              raise SystemExit('Missing layout invariants: ' + ', '.join(missing))

          required_settings = [
              'id="layout-center_past_edges"',
              "setChecked('layout-center_past_edges', cfg.layout.center_past_edges);",
              "center_past_edges: checked('layout-center_past_edges')",
          ]
          missing = [marker for marker in required_settings if marker not in settings]
          if missing:
              raise SystemExit('Missing Settings wiring: ' + ', '.join(missing))

          if 'horizontal_isolation_matrix_never_leaks_tiled_windows' not in tests:
              raise SystemExit('Missing monitor-isolation matrix test')
          print('source and Settings contracts: OK')
          '@ | python -

      - name: Run full locked test suite
        working-directory: source
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy with warnings denied
        working-directory: source
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check every Cargo target
        working-directory: source
        run: cargo check --workspace --all-targets --locked

      - name: Run optimized library and binary tests
        working-directory: source
        run: cargo test --workspace --lib --bins --tests --release --locked

      - name: Stress edge and geometry regressions
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i = 0; $i -lt 10; $i++) {
            cargo test -p leopardwm-core-layout --test edge_centering --release --locked -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "edge-centering iteration $i failed" }
            cargo test -p leopardwm-daemon --bin leopardwm --release --locked edge_safety_audit_tests -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "monitor-isolation iteration $i failed" }
          }
          foreach ($filter in @('compositor', 'geometry_mismatch', 'scratchpad', 'floating')) {
            for ($i = 0; $i -lt 3; $i++) {
              cargo test -p leopardwm-daemon --bin leopardwm --release --locked $filter -- --test-threads=1
              if ($LASTEXITCODE -ne 0) { throw "$filter iteration $i failed" }
            }
          }

      - name: Build optimized Windows binaries
        working-directory: source
        run: cargo build --workspace --release --locked

      - name: Verify Windows GUI subsystems
        working-directory: source
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1 -RepoRoot (Get-Location).Path

      - name: Install cargo-wix
        run: cargo install cargo-wix --version ^0.3 --locked

      - name: Build MSI installer
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo wix -p leopardwm-daemon -I wix/main.wxs --target x86_64-pc-windows-msvc --no-build --nocapture --bin-path 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if ($LASTEXITCODE -ne 0) { throw 'cargo wix failed' }
          $built = Get-ChildItem target/wix/*.msi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $built) { throw 'cargo wix produced no MSI' }
          Copy-Item $built.FullName "LeopardWM-$env:RELEASE_VERSION-x86_64.msi"

      - name: Verify MSI administrative installation
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path "LeopardWM-$env:RELEASE_VERSION-x86_64.msi").Path
          $admin = Join-Path (Get-Location) 'msi-admin-image'
          New-Item -ItemType Directory -Path $admin -Force | Out-Null
          $args = "/a `"$msi`" /qn TARGETDIR=`"$admin`""
          $process = Start-Process "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI administrative install failed: $($process.ExitCode)" }

          $binDir = @('target/x86_64-pc-windows-msvc/release', 'target/release') |
            Where-Object { Test-Path (Join-Path $_ 'leopardwm.exe') } |
            Select-Object -First 1
          if (-not $binDir) { throw 'Release binary directory not found' }
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            $installed = Get-ChildItem $admin -Recurse -Filter $binary | Select-Object -First 1
            if (-not $installed) { throw "MSI is missing $binary" }
            $expected = (Get-FileHash (Join-Path $binDir $binary) -Algorithm SHA256).Hash
            $actual = (Get-FileHash $installed.FullName -Algorithm SHA256).Hash
            if ($expected -ne $actual) { throw "MSI binary mismatch: $binary" }
          }

      - name: Commit verified source and fast-forward main
        id: source_commit
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/daemon/src/layout_apply.rs crates/daemon/src/layout_apply_edge_tests.rs crates/core_layout/tests/edge_centering.rs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged diff check failed' }
          git commit -m 'fix: keep focused columns visible without monitor bleed'
          if ($LASTEXITCODE -ne 0) { throw 'source commit failed' }
          $candidate = (git rev-parse HEAD).Trim()
          git push origin HEAD:refs/heads/$env:SOURCE_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'source branch push failed' }

          $remoteMain = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($remoteMain -ne $env:EXPECTED_MAIN_SHA) {
            throw "main changed during verification: expected=$env:EXPECTED_MAIN_SHA actual=$remoteMain"
          }
          git push origin HEAD:refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'main fast-forward failed' }
          $verifiedMain = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($verifiedMain -ne $candidate) {
            throw "main identity mismatch: candidate=$candidate main=$verifiedMain"
          }
          "sha=$candidate" >> $env:GITHUB_OUTPUT
          Write-Host "Verified source commit: $candidate"

      - name: Package ZIP and standalone binaries
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = @('target/x86_64-pc-windows-msvc/release', 'target/release') |
            Where-Object { Test-Path (Join-Path $_ 'leopardwm.exe') } |
            Select-Object -First 1
          if (-not $binDir) { throw 'Release binary directory not found' }

          $packageDir = "LeopardWM-$env:RELEASE_VERSION-x86_64-windows"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            $source = Join-Path $binDir $binary
            Copy-Item $source (Join-Path $packageDir $binary)
            Copy-Item $source $binary
          }
          Copy-Item README.md, LICENSE, CHANGELOG.md $packageDir
          7z a "$packageDir.zip" $packageDir | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging failed' }

      - name: Generate checksums and release notes
        working-directory: source
        shell: pwsh
        run: |
          $assets = @(
            "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip",
            "LeopardWM-$env:RELEASE_VERSION-x86_64.msi",
            'leopardwm.exe',
            'leopardwm-cli.exe',
            'lwm.exe',
            'leopardwm-watchdog.exe'
          )
          foreach ($asset in $assets) {
            "{0} *{1}" -f (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant(), $asset
          } | Set-Content checksums.txt -Encoding ascii
          @'
          Personal-fork prerelease from `sehoon123/LeopardWM`.

          Edge-safety audit and fix:
          - revalidates true first/last-column centering when `centering_mode = "center"` and `center_past_edges = true`
          - covers reduced-motion, interrupted animation, minimized edge columns, and bounded manual scrolling
          - keeps the active focused tiled column visible at a monitor boundary by containing it in the owner work area
          - parks non-focused tiled overflow clear of every monitor
          - keeps floating windows free to span monitors intentionally
          - applies isolation after transition interpolation; exiting workspace windows never receive the focus exemption
          - verifies the Settings GUI checkbox is present and wired for load/save

          The stable whole-window policy deliberately avoids per-frame SetWindowRgn clipping.
          '@ | Set-Content release-notes-v9.md -Encoding utf8

      - name: Publish prerelease
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "LeopardWM-$RELEASE_VERSION-x86_64-windows.zip" \
            "LeopardWM-$RELEASE_VERSION-x86_64.msi" \
            leopardwm.exe leopardwm-cli.exe lwm.exe leopardwm-watchdog.exe checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "LeopardWM $RELEASE_TAG — edge safety audit" \
            --notes-file release-notes-v9.md \
            --prerelease

      - name: Independently verify published assets
        working-directory: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $verify = Join-Path (Get-Location) 'published-verification'
          New-Item -ItemType Directory -Path $verify -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }

          foreach ($line in Get-Content (Join-Path $verify 'checksums.txt')) {
            if ($line -notmatch '^([0-9a-f]{64}) \*(.+)$') { throw "Invalid checksum line: $line" }
            $path = Join-Path $verify $Matches[2]
            if (-not (Test-Path $path)) { throw "Missing asset: $($Matches[2])" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" }
          }

          $zip = Join-Path $verify "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip"
          7z t $zip | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Published ZIP CRC check failed' }
          $extract = Join-Path $verify 'zip-extracted'
          7z x $zip "-o$extract" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Published ZIP extraction failed' }

          $msi = Join-Path $verify "LeopardWM-$env:RELEASE_VERSION-x86_64.msi"
          $admin = Join-Path $verify 'msi-admin-image'
          New-Item -ItemType Directory -Path $admin -Force | Out-Null
          $args = "/a `"$msi`" /qn TARGETDIR=`"$admin`""
          $process = Start-Process "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published MSI install failed: $($process.ExitCode)" }

          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            $standalone = Join-Path $verify $binary
            $fromZip = Get-ChildItem $extract -Recurse -Filter $binary | Select-Object -First 1
            $fromMsi = Get-ChildItem $admin -Recurse -Filter $binary | Select-Object -First 1
            if (-not $fromZip -or -not $fromMsi) { throw "Packaged binary missing: $binary" }
            $expected = (Get-FileHash $standalone -Algorithm SHA256).Hash
            if ((Get-FileHash $fromZip.FullName -Algorithm SHA256).Hash -ne $expected) {
              throw "ZIP binary mismatch: $binary"
            }
            if ((Get-FileHash $fromMsi.FullName -Algorithm SHA256).Hash -ne $expected) {
              throw "MSI binary mismatch: $binary"
            }
          }

          git fetch origin --tags --force
          $tagSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $mainSha = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($tagSha -ne $env:SOURCE_SHA -or $mainSha -ne $env:SOURCE_SHA) {
            throw "Source identity mismatch: tag=$tagSha main=$mainSha expected=$env:SOURCE_SHA"
          }

      - name: Publish success status
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          set -euo pipefail
          path='agent_docs/edge-safety-v9-status.json'
          zip_hash=$(sha256sum "LeopardWM-$RELEASE_VERSION-x86_64-windows.zip" | awk '{print $1}')
          msi_hash=$(sha256sum "LeopardWM-$RELEASE_VERSION-x86_64.msi" | awk '{print $1}')
          payload=$(jq -n \
            --arg state success \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg zip_sha256 "$zip_hash" \
            --arg msi_sha256 "$msi_hash" \
            '{state:$state,run_id:$run_id,run_url:$run_url,tag:$tag,source_sha:$source_sha,zip_sha256:$zip_sha256,msi_sha256:$msi_sha256}')
          content=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CONTROL_BRANCH" --jq .sha)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='ci: record successful edge-safety v9 release' \
            -f content="$content" -f branch="$CONTROL_BRANCH" -f sha="$current" >/dev/null

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: LeopardWM-v0.2.6-sehoon.9-verified
          path: |
            source/LeopardWM-0.2.6-sehoon.9-x86_64-windows.zip
            source/LeopardWM-0.2.6-sehoon.9-x86_64.msi
            source/checksums.txt
            source/release-notes-v9.md
          if-no-files-found: error
          retention-days: 14
