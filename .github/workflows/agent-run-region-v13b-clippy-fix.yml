name: Converge atomic-region verification

on:
  push:
    branches:
      - agent/region-atomic-v13b-control
    paths:
      - .github/workflows/agent-run-region-v13b-clippy-fix.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/region-atomic-v13b-control
          fetch-depth: 0
      - name: Keep only the newest release verification active
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/agent-region-atomic-v13b.yml')
          text = path.read_text(encoding='utf-8')
          old = '  cancel-in-progress: false\n'
          new = '  cancel-in-progress: true\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old concurrency flag, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Commit workflow convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/agent-region-atomic-v13b.yml
          git commit -m 'ci: cancel obsolete atomic-region release attempts'
          git push origin HEAD:refs/heads/agent/region-atomic-v13b-control
