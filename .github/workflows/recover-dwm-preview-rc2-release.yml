name: Recover and publicly verify DWM preview RC2

on:
  push:
    branches:
      - control/dwm-preview-proxy-v15
    paths:
      - .github/workflows/recover-dwm-preview-rc2-release.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: recover-dwm-preview-rc2
  cancel-in-progress: true

env:
  TAG: v0.2.6-sehoon.15-rc2
  SOURCE_SHA: c22a3e3c14a4784f367c5797a05688420d486cf3
  SOURCE_RUN_ID: "32365442969"
  ARTIFACT_NAME: LeopardWM-v0.2.6-sehoon.15-rc2-verified
  ZIP_NAME: LeopardWM-0.2.6-sehoon.15-rc2-x86_64-windows.zip
  MSI_NAME: LeopardWM-0.2.6-sehoon.15-rc2-x86_64.msi
  CONTROL_BRANCH: control/dwm-preview-proxy-v15

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_BRANCH }}
          fetch-depth: 0

      - name: Verify tag and restore verified artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"

          rm -rf restored publish
          mkdir -p restored publish
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir restored

          for name in "$ZIP_NAME" "$MSI_NAME" checksums.txt release-notes-v15-rc2.md; do
            path=$(find restored -type f -name "$name" -print -quit)
            test -n "$path"
            cp "$path" "publish/$name"
          done
          tr -d '\r' < publish/checksums.txt > publish/checksums.normalized
          mv publish/checksums.normalized publish/checksums.txt

          cd publish
          sha256sum -c checksums.txt
          unzip -t "$ZIP_NAME" >/dev/null
          test "$(od -An -tx1 -N8 "$MSI_NAME" | tr -d ' \n')" = d0cf11e0a1b11ae1

      - name: Create or repair public prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="LeopardWM $TAG — DWM monitor preview proxy"
          notes=$(cat publish/release-notes-v15-rc2.md)
          release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' \
            | head -n 1)

          if [[ -n "$release_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f name="$title" -f body="$notes" -F draft=false -F prerelease=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$SOURCE_SHA" \
              -f name="$title" -f body="$notes" \
              -F draft=false -F prerelease=true >/dev/null
          fi

          gh release upload "$TAG" \
            "publish/$ZIP_NAME" "publish/$MSI_NAME" publish/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify current public release without authentication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          jq -e '.draft == false and .prerelease == true' <<<"$release" >/dev/null
          for name in "$ZIP_NAME" "$MSI_NAME" checksums.txt; do
            jq -e --arg name "$name" '.assets | any(.name == $name)' <<<"$release" >/dev/null
          done

          rm -rf downloaded
          mkdir downloaded
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p "$ZIP_NAME" -p "$MSI_NAME" -p checksums.txt -D downloaded
          cd downloaded
          tr -d '\r' < checksums.txt > checksums.normalized
          sha256sum -c checksums.normalized
          unzip -t "$ZIP_NAME" >/dev/null
          cd ..

          base="https://github.com/$GITHUB_REPOSITORY/releases"
          curl -fsSL --retry 3 -o /dev/null "$base/tag/$TAG"
          curl -fsSL --retry 3 --range 0-0 -o /dev/null "$base/download/$TAG/$ZIP_NAME"
          curl -fsSL --retry 3 --range 0-0 -o /dev/null "$base/download/$TAG/$MSI_NAME"

      - name: Record verified current state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=agent_docs/dwm-preview-v15-rc2-current.json
          base="https://github.com/$GITHUB_REPOSITORY/releases"
          zip_hash=$(sha256sum "publish/$ZIP_NAME" | awk '{print $1}')
          msi_hash=$(sha256sum "publish/$MSI_NAME" | awk '{print $1}')
          payload=$(jq -n \
            --arg state success --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg tag "$TAG" --arg source_sha "$SOURCE_SHA" \
            --arg release_url "$base/tag/$TAG" \
            --arg zip_name "$ZIP_NAME" --arg zip_url "$base/download/$TAG/$ZIP_NAME" --arg zip_sha256 "$zip_hash" \
            --arg msi_name "$MSI_NAME" --arg msi_url "$base/download/$TAG/$MSI_NAME" --arg msi_sha256 "$msi_hash" \
            '{state:$state,run_id:$run_id,run_url:$run_url,tag:$tag,source_sha:$source_sha,release_url:$release_url,zip:{name:$zip_name,url:$zip_url,sha256:$zip_sha256},msi:{name:$msi_name,url:$msi_url,sha256:$msi_sha256},public_access_verified:true}')
          encoded=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CONTROL_BRANCH" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='ci: record current public RC2 release' -f content="$encoded" -f branch="$CONTROL_BRANCH")
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null

      - name: Record failure
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=agent_docs/dwm-preview-v15-rc2-current.json
          payload=$(jq -n --arg state failure --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,run_id:$run_id,run_url:$run_url,public_access_verified:false}')
          encoded=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CONTROL_BRANCH" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='ci: record RC2 release recovery failure' -f content="$encoded" -f branch="$CONTROL_BRANCH")
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null
