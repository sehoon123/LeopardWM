name: Build clean v5 production candidate

on:
  push:
    branches:
      - agent/v5-release-control
    paths:
      - .github/workflows/v5-production-release.yml

permissions:
  contents: write

concurrency:
  group: leopardwm-v5-production-release
  cancel-in-progress: false

jobs:
  validate-build-release:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      TARGET_BRANCH: agent/performance-audit-03
      RELEASE_TAG: v0.2.6-sehoon.5
      RELEASE_VERSION: 0.2.6-sehoon.5

    steps:
      - name: Check out optimized target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/performance-audit-03
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy,rustfmt

      - name: Apply idempotent allocation and source-layout cleanup
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          root = Path.cwd()

          def span(text: str, needle: str):
              start = text.find(needle)
              if start < 0:
                  raise RuntimeError(f"missing {needle}")
              brace = text.find("{", start)
              depth = 0
              state = "code"
              raw_hashes = 0
              i = brace
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ""
                  if state == "line":
                      if ch == "\n": state = "code"
                      i += 1; continue
                  if state == "block":
                      if ch == "*" and nxt == "/": state = "code"; i += 2; continue
                      i += 1; continue
                  if state == "string":
                      if ch == "\\": i += 2; continue
                      if ch == '"': state = "code"
                      i += 1; continue
                  if state == "raw":
                      if ch == '"' and text.startswith("#" * raw_hashes, i + 1):
                          i += 1 + raw_hashes; state = "code"
                      i += 1; continue
                  if ch == "/" and nxt == "/": state = "line"; i += 2; continue
                  if ch == "/" and nxt == "*": state = "block"; i += 2; continue
                  if ch == '"': state = "string"; i += 1; continue
                  if ch == "r":
                      match = re.match(r'r(#{0,16})"', text[i:])
                      if match:
                          raw_hashes = len(match.group(1)); state = "raw"; i += len(match.group(0)); continue
                  if ch == "{": depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0: return start, i + 1
                  i += 1
              raise RuntimeError(f"unterminated {needle}")

          def reserve(item: str, variable: str, capacity: str):
              pattern = re.compile(
                  rf"(?m)^(?P<prefix>\s*let\s+mut\s+{re.escape(variable)}(?:\s*:\s*[^=;]+)?\s*=\s*)Vec::new\(\);"
              )
              return pattern.subn(rf"\g<prefix>Vec::with_capacity({capacity});", item, count=1)

          layout = next(
              path for path in (root / "crates/core_layout").rglob("*.rs")
              if "fn compute_non_fullscreen_placements" in path.read_text(encoding="utf-8")
          )
          source = layout.read_text(encoding="utf-8")
          start, end = span(source, "fn compute_non_fullscreen_placements")
          item = source[start:end]
          item, changed = reserve(item, "placements", "self.window_count()")
          if changed == 0 and "Vec::with_capacity(self.window_count())" not in item:
              raise RuntimeError("layout output allocation is neither optimized nor recognized")
          for variable in ("visible_windows", "visible_weights", "min_heights"):
              item, _ = reserve(item, variable, "column.windows.len()")
          layout.write_text(source[:start] + item + source[end:], encoding="utf-8", newline="\n")

          html_rs = root / "crates/daemon/src/settings/html.rs"
          html_asset = root / "crates/daemon/src/settings/settings.html"
          if not html_asset.exists():
              source = html_rs.read_text(encoding="utf-8")
              pattern = re.compile(
                  r'(?P<decl>pub(?:\([^\)]+\))?\s+const\s+SETTINGS_HTML\s*:\s*&str\s*=\s*)'
                  r'r(?P<h>#{0,16})"(?P<body>.*?)"(?P=h);', re.S
              )
              match = pattern.search(source)
              if not match: raise RuntimeError("SETTINGS_HTML raw literal not found")
              html_asset.write_text(match.group("body"), encoding="utf-8", newline="\n")
              source = source[:match.start()] + match.group("decl") + 'include_str!("settings.html");' + source[match.end():]
              html_rs.write_text(source, encoding="utf-8", newline="\n")

          for path in (root / "crates/daemon/src").rglob("*.rs"):
              source = path.read_text(encoding="utf-8")
              before = source
              for function, names in (
                  ("column_bounds_from_placements", ("bounds", "column_bounds")),
                  ("partition_for_animation", ("live", "live_placements")),
              ):
                  if f"fn {function}" not in source: continue
                  start, end = span(source, f"fn {function}")
                  item = source[start:end]
                  for name in names:
                      item, _ = reserve(item, name, "placements.len()")
                  source = source[:start] + item + source[end:]
              if source != before:
                  path.write_text(source, encoding="utf-8", newline="\n")

          cargo_path = root / "Cargo.toml"
          cargo = cargo_path.read_text(encoding="utf-8")
          profile = re.search(r"(?ms)^\[profile\.release\]\n.*?(?=^\[|\Z)", cargo)
          if profile and "incremental =" not in profile.group(0):
              block = profile.group(0).rstrip() + "\nincremental = false\n"
              cargo_path.write_text(cargo[:profile.start()] + block + cargo[profile.end():], encoding="utf-8", newline="\n")

          report = root / "agent_docs/sehoon-fork-performance-audit.md"
          if not report.exists():
              report.write_text(
                  "# Sehoon fork performance audit — pass 3\n\n"
                  "The fork preallocates layout and daemon scratch vectors from exact upper bounds, "
                  "stores the Settings page as a native HTML asset, and preserves event timing and order.\n",
                  encoding="utf-8", newline="\n"
              )
          '@ | Set-Content -Encoding utf8 .github/v5_prepare.py
          python .github/v5_prepare.py

      - name: Remove all transient audit machinery before validation
        shell: pwsh
        run: |
          $paths = @(
            'CONTROL.md',
            'agent_docs/README.tmp',
            'agent_docs/control-note.tmp',
            '.github/workflows/agent-performance-audit-release.yml',
            '.github/workflows/agent-export-performance-source.yml',
            '.github/workflows/agent-export-patch.yml',
            '.github/workflows/agent-full-audit-release.yml',
            '.github/workflows/agent-v4-release-sentinel.yml',
            '.github/workflows/agent-v4-recovery.yml',
            '.github/workflows/agent-v4-control.yml',
            '.github/workflows/agent-v4-final-cleanup.yml',
            '.github/scripts/apply_performance_audit.py',
            '.github/audit/trigger-performance-audit-v4',
            '.github/ensure_v4.py',
            '.github/recover_v4.py',
            '.github/v5_prepare.py'
          )
          foreach ($path in $paths) { Remove-Item $path -ErrorAction SilentlyContinue }

      - name: Formatting gate
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Complete locked test gate
        run: cargo test --all --locked

      - name: Optimized layout test gate
        run: cargo test --release -p leopardwm-core-layout --locked

      - name: All-target Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: All-target compile gate
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Optimized Windows build
        run: cargo build --release --workspace --locked

      - name: Verify PE subsystems
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1

      - name: Record release evidence
        shell: pwsh
        run: |
          $binDir = 'target/x86_64-pc-windows-msvc/release'
          $lines = @('', '## v0.2.6-sehoon.5 build evidence', '', '| Binary | Bytes | SHA-256 |', '|---|---:|---|')
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            $path = "$binDir/$binary"
            $size = (Get-Item $path).Length
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            $lines += "| ``$binary`` | $size | ``$hash`` |"
          }
          $lines += @('', 'Validation: full tests, optimized layout tests, all-target/all-feature Clippy and check, release build, and PE subsystem verification passed before this evidence was written.')
          Add-Content -Encoding utf8 agent_docs/sehoon-fork-performance-audit.md $lines

      - name: Commit clean verified source
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            $sha = git rev-parse HEAD
          } else {
            git commit -m "perf: finalize clean production performance candidate"
            git push origin HEAD:$env:TARGET_BRANCH
            $sha = git rev-parse HEAD
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Package verified binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = 'target/x86_64-pc-windows-msvc/release'
          $packageDir = "LeopardWM-$env:RELEASE_VERSION-x86_64-windows"
          $zipPath = "$packageDir.zip"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          $binaries = @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')
          foreach ($binary in $binaries) {
            Copy-Item "$binDir/$binary" "$packageDir/$binary"
            Copy-Item "$binDir/$binary" $binary
          }
          Copy-Item README.md, LICENSE, agent_docs/sehoon-fork-code-audit.md, agent_docs/sehoon-fork-performance-audit.md $packageDir
          Compress-Archive -Path $packageDir -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $assets = @($zipPath) + $binaries
          $checksumLines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash *$asset"
          }
          $checksumLines | Set-Content -Encoding ascii checksums.txt
          Get-Content checksums.txt

      - name: Publish clean production candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          @'
          Personal-fork production candidate from `sehoon123/LeopardWM`.

          This clean source tag includes the verified allocation/source-layout performance pass and excludes all one-shot audit machinery.

          Release gate:
          - formatting
          - complete locked tests
          - optimized core-layout tests
          - all-target/all-feature Clippy with warnings denied
          - all-target/all-feature compile check
          - optimized Windows workspace build
          - PE GUI-subsystem verification

          The package includes the detailed performance-audit document and checksums. Nothing was sent upstream.
          '@ | Set-Content -Encoding utf8 release-notes.md
          gh release create $env:RELEASE_TAG `
            "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip" `
            leopardwm.exe leopardwm-cli.exe lwm.exe leopardwm-watchdog.exe checksums.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SOURCE_SHA `
            --title "LeopardWM $env:RELEASE_TAG — clean production candidate" `
            --notes-file release-notes.md `
            --prerelease
