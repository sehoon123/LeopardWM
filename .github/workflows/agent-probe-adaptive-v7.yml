name: Probe adaptive v7 workflow

on:
  push:
    branches:
      - agent/adaptive-smooth-v7-control2
    paths:
      - .github/workflows/agent-probe-adaptive-v7.yml

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record latest validation runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch='agent/adaptive-smooth-v7-control2'
          workflow='agent-apply-adaptive-smooth-v7.yml'
          path='agent_docs/adaptive-smooth-v7-run-probe.json'
          payload=$(gh api "repos/$repo/actions/workflows/$workflow/runs?branch=$branch&per_page=10" \
            --jq '{runs: [.workflow_runs[] | {id,status,conclusion,head_sha,run_number,html_url,created_at,updated_at}]}')
          content=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$repo/contents/$path?ref=$branch" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/$repo/contents/$path" -f message='ci: record adaptive v7 run probe' -f content="$content" -f branch="$branch")
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null
