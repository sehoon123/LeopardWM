name: Fix focus-scroll patch delimiter

on:
  push:
    branches:
      - agent/focus-scroll-modes-v12-control
    paths:
      - .github/workflows/agent-fix-focus-scroll-patch-v12.yml

permissions:
  contents: write

jobs:
  fix-control-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/focus-scroll-modes-v12-control
          fetch-depth: 0

      - name: Preserve the existing test-module marker once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/focus-v12/apply_focus_scroll_modes.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "    '}\\n\\n#[cfg(test)]\\nmod edge_centering_tests',\n":
                  "    '#[cfg(test)]\\nmod edge_centering_tests',\n",
              "    }\\n}\\n\\n#[cfg(test)]\\nmod edge_centering_tests''',\n":
                  "    }\\n}\\n\\n''',\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one patch delimiter occurrence: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Commit the corrected patch script
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/focus-v12/apply_focus_scroll_modes.py
          git commit -m 'fix: preserve focus-scroll test module delimiter'
          git push origin HEAD:refs/heads/agent/focus-scroll-modes-v12-control
