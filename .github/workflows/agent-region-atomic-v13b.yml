name: Verify and release atomic monitor clipping

on:
  push:
    branches:
      - agent/region-atomic-v13b-control
    paths:
      - .github/workflows/agent-region-atomic-v13b.yml
      - .github/region-v13b/**

permissions:
  contents: write
  actions: read

concurrency:
  group: region-atomic-v13b
  cancel-in-progress: false

env:
  CONTROL_BRANCH: agent/region-atomic-v13b-control
  SOURCE_BRANCH: agent/region-atomic-v13b-source
  EXPECTED_MAIN_SHA: 23e5147a9bd6c99b9651ba8974f02ea9e52e25c2
  RELEASE_TAG: v0.2.6-sehoon.13
  RELEASE_VERSION: 0.2.6-sehoon.13

jobs:
  verify-build-release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out control files
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_BRANCH }}
          path: control
          fetch-depth: 0

      - name: Check out product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          path: source
          fetch-depth: 0

      - name: Record workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='agent_docs/region-atomic-v13b-status.json'
          payload=$(jq -n \
            --arg state started \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg expected_main "$EXPECTED_MAIN_SHA" \
            '{state:$state,run_id:$run_id,run_url:$run_url,expected_main:$expected_main}')
          content=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CONTROL_BRANCH" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='ci: record atomic region run' -f content="$content" -f branch="$CONTROL_BRANCH")
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply the atomic region patch
        working-directory: source
        run: python ../control/.github/region-v13b/apply_atomic_region.py

      - name: Format and validate the exact diff
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt check failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }
          $allowed = @(
            'crates/platform_win32/src/placement.rs',
            'crates/platform_win32/src/window_region.rs'
          )
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) {
            throw "Unexpected changed files: $($unexpected -join ', ')"
          }

      - name: Verify atomic clipping contracts
        working-directory: source
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          region = Path('crates/platform_win32/src/window_region.rs').read_text(encoding='utf-8')
          placement = Path('crates/platform_win32/src/placement.rs').read_text(encoding='utf-8')
          required = {
              'bridge geometry': 'pub(crate) fn bridge_clip_region(',
              'pre-move restriction': 'pub(crate) fn prepare_window_region_clip(',
              'direct region replacement': 'Clearing first creates an unbounded',
              'pre-uncloak commit': 'prepare_entry_region_clips(',
              'post-move reconciliation': 'Regions on windows becoming fully contained',
              'ordered boundary placement': 'Keep SetWindowRgn and SetWindowPos ordered',
              '75 percent regression': 'seventy_five_percent_preview_masks_the_negative_monitor_half',
              'outward ordering': 'outward_move_restricts_before_positioning',
              'inward ordering': 'inward_move_expands_only_after_positioning',
          }
          combined = region + '\n' + placement
          missing = [name for name, marker in required.items() if marker not in combined]
          if missing:
              raise SystemExit('Missing atomic-region contracts: ' + ', '.join(missing))
          print('atomic-region contracts: OK')
          '@ | python -

      - name: Run focused Win32 region tests first
        working-directory: source
        run: cargo test -p leopardwm-platform-win32 window_region --locked -- --test-threads=1

      - name: Run full locked test suite
        working-directory: source
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy with warnings denied
        working-directory: source
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check every Cargo target
        working-directory: source
        run: cargo check --workspace --all-targets --locked

      - name: Run optimized tests
        working-directory: source
        run: cargo test --workspace --lib --bins --tests --release --locked

      - name: Stress clipping and existing geometry regressions
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i = 0; $i -lt 8; $i++) {
            cargo test -p leopardwm-platform-win32 --release --locked window_region -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "window-region iteration $i failed" }
          }
          foreach ($filter in @('focus_mode_preview_tests', 'geometry_mismatch', 'compositor', 'scratchpad', 'floating')) {
            for ($i = 0; $i -lt 2; $i++) {
              cargo test --workspace --release --locked $filter -- --test-threads=1
              if ($LASTEXITCODE -ne 0) { throw "$filter iteration $i failed" }
            }
          }

      - name: Build optimized Windows binaries
        working-directory: source
        run: cargo build --workspace --release --locked

      - name: Verify Windows GUI subsystems
        working-directory: source
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1 -RepoRoot (Get-Location).Path

      - name: Install cargo-wix
        run: cargo install cargo-wix --version ^0.3 --locked

      - name: Build MSI installer
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo wix -p leopardwm-daemon -I wix/main.wxs --target x86_64-pc-windows-msvc --no-build --nocapture --bin-path 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if ($LASTEXITCODE -ne 0) { throw 'cargo wix failed' }
          $built = Get-ChildItem target/wix/*.msi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $built) { throw 'cargo wix produced no MSI' }
          Copy-Item $built.FullName "LeopardWM-$env:RELEASE_VERSION-x86_64.msi"

      - name: Verify locally built MSI
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path "LeopardWM-$env:RELEASE_VERSION-x86_64.msi").Path
          $admin = Join-Path (Get-Location) 'msi-admin-image'
          New-Item -ItemType Directory -Path $admin -Force | Out-Null
          $arguments = "/a `"$msi`" /qn TARGETDIR=`"$admin`""
          $process = Start-Process "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI administrative install failed: $($process.ExitCode)" }
          $binDir = @('target/x86_64-pc-windows-msvc/release', 'target/release') |
            Where-Object { Test-Path (Join-Path $_ 'leopardwm.exe') } |
            Select-Object -First 1
          if (-not $binDir) { throw 'Release binary directory not found' }
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            $installed = Get-ChildItem $admin -Recurse -Filter $binary | Select-Object -First 1
            if (-not $installed) { throw "MSI is missing $binary" }
            if ((Get-FileHash $installed.FullName -Algorithm SHA256).Hash -ne (Get-FileHash (Join-Path $binDir $binary) -Algorithm SHA256).Hash) {
              throw "MSI binary mismatch: $binary"
            }
          }

      - name: Commit verified source and fast-forward main
        id: source_commit
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/platform_win32/src/placement.rs crates/platform_win32/src/window_region.rs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged diff check failed' }
          git commit -m 'fix: commit monitor clipping before window movement'
          if ($LASTEXITCODE -ne 0) { throw 'source commit failed' }
          $candidate = (git rev-parse HEAD).Trim()
          git push origin HEAD:refs/heads/$env:SOURCE_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'source branch push failed' }

          $remoteMain = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($remoteMain -ne $env:EXPECTED_MAIN_SHA) {
            throw "main changed during verification: expected=$env:EXPECTED_MAIN_SHA actual=$remoteMain"
          }
          git push origin HEAD:refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'main fast-forward failed' }
          $verifiedMain = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($verifiedMain -ne $candidate) {
            throw "main identity mismatch: candidate=$candidate main=$verifiedMain"
          }
          "sha=$candidate" >> $env:GITHUB_OUTPUT
          Write-Host "Verified source commit: $candidate"

      - name: Package ZIP and standalone binaries
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = @('target/x86_64-pc-windows-msvc/release', 'target/release') |
            Where-Object { Test-Path (Join-Path $_ 'leopardwm.exe') } |
            Select-Object -First 1
          if (-not $binDir) { throw 'Release binary directory not found' }
          $packageDir = "LeopardWM-$env:RELEASE_VERSION-x86_64-windows"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            $source = Join-Path $binDir $binary
            Copy-Item $source (Join-Path $packageDir $binary)
            Copy-Item $source $binary
          }
          Copy-Item README.md, LICENSE, CHANGELOG.md $packageDir
          7z a "$packageDir.zip" $packageDir | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging failed' }

      - name: Generate checksums and release notes
        working-directory: source
        shell: pwsh
        run: |
          $assets = @(
            "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip",
            "LeopardWM-$env:RELEASE_VERSION-x86_64.msi",
            'leopardwm.exe',
            'leopardwm-cli.exe',
            'lwm.exe',
            'leopardwm-watchdog.exe'
          )
          $lines = foreach ($asset in $assets) {
            "{0} *{1}" -f (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant(), $asset
          }
          $lines | Set-Content checksums.txt -Encoding ascii
          @'
          Personal-fork prerelease from `sehoon123/LeopardWM`.

          Atomic monitor-edge clipping:
          - installs a bridge HRGN before a crossing window is uncloaked or moved
          - the bridge is safe at the current, target, and every interpolated position
          - moves that become less clipped expand only after synchronous placement
          - moves that become more clipped restrict before placement
          - opposite-edge jumps use an empty temporary bridge rather than exposing another monitor
          - replaces LeopardWM-owned regions directly without a clear-then-set gap
          - keeps application-owned custom regions on the conservative fallback path
          - only region-managed boundary windows use synchronous placement; the common animation path remains unchanged
          '@ | Set-Content release-notes-v13.md -Encoding utf8

      - name: Publish prerelease
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "LeopardWM-$RELEASE_VERSION-x86_64-windows.zip" \
            "LeopardWM-$RELEASE_VERSION-x86_64.msi" \
            leopardwm.exe leopardwm-cli.exe lwm.exe leopardwm-watchdog.exe checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "LeopardWM $RELEASE_TAG — atomic monitor clipping" \
            --notes-file release-notes-v13.md \
            --prerelease

      - name: Independently verify published assets
        working-directory: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $verify = Join-Path (Get-Location) 'published-verification'
          New-Item -ItemType Directory -Path $verify -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          foreach ($line in Get-Content (Join-Path $verify 'checksums.txt')) {
            if ($line -notmatch '^([0-9a-f]{64}) \*(.+)$') { throw "Invalid checksum line: $line" }
            $path = Join-Path $verify $Matches[2]
            if (-not (Test-Path $path)) { throw "Missing asset: $($Matches[2])" }
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches[1]) {
              throw "Checksum mismatch: $($Matches[2])"
            }
          }
          $zip = Join-Path $verify "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip"
          7z t $zip | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Published ZIP CRC check failed' }
          $extract = Join-Path $verify 'zip-extracted'
          7z x $zip "-o$extract" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Published ZIP extraction failed' }
          $msi = Join-Path $verify "LeopardWM-$env:RELEASE_VERSION-x86_64.msi"
          $admin = Join-Path $verify 'msi-admin-image'
          New-Item -ItemType Directory -Path $admin -Force | Out-Null
          $arguments = "/a `"$msi`" /qn TARGETDIR=`"$admin`""
          $process = Start-Process "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published MSI install failed: $($process.ExitCode)" }
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            $standalone = Join-Path $verify $binary
            $fromZip = Get-ChildItem $extract -Recurse -Filter $binary | Select-Object -First 1
            $fromMsi = Get-ChildItem $admin -Recurse -Filter $binary | Select-Object -First 1
            if (-not $fromZip -or -not $fromMsi) { throw "Packaged binary missing: $binary" }
            $expected = (Get-FileHash $standalone -Algorithm SHA256).Hash
            if ((Get-FileHash $fromZip.FullName -Algorithm SHA256).Hash -ne $expected) { throw "ZIP binary mismatch: $binary" }
            if ((Get-FileHash $fromMsi.FullName -Algorithm SHA256).Hash -ne $expected) { throw "MSI binary mismatch: $binary" }
          }
          git fetch origin --tags --force
          $tagSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $mainSha = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($tagSha -ne $env:SOURCE_SHA -or $mainSha -ne $env:SOURCE_SHA) {
            throw "Source identity mismatch: tag=$tagSha main=$mainSha expected=$env:SOURCE_SHA"
          }

      - name: Publish success status
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          set -euo pipefail
          path='agent_docs/region-atomic-v13b-status.json'
          zip_hash=$(sha256sum "LeopardWM-$RELEASE_VERSION-x86_64-windows.zip" | awk '{print $1}')
          msi_hash=$(sha256sum "LeopardWM-$RELEASE_VERSION-x86_64.msi" | awk '{print $1}')
          payload=$(jq -n \
            --arg state success \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg zip_sha256 "$zip_hash" \
            --arg msi_sha256 "$msi_hash" \
            '{state:$state,run_id:$run_id,run_url:$run_url,tag:$tag,source_sha:$source_sha,zip_sha256:$zip_sha256,msi_sha256:$msi_sha256}')
          content=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CONTROL_BRANCH" --jq .sha)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='ci: record successful atomic region release' \
            -f content="$content" -f branch="$CONTROL_BRANCH" -f sha="$current" >/dev/null

      - name: Publish failure status
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='agent_docs/region-atomic-v13b-status.json'
          payload=$(jq -n --arg state failure --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,run_id:$run_id,run_url:$run_url}')
          content=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CONTROL_BRANCH" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='ci: record failed atomic region release' -f content="$content" -f branch="$CONTROL_BRANCH")
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: LeopardWM-v0.2.6-sehoon.13-verified
          path: |
            source/LeopardWM-0.2.6-sehoon.13-x86_64-windows.zip
            source/LeopardWM-0.2.6-sehoon.13-x86_64.msi
            source/checksums.txt
            source/release-notes-v13.md
          if-no-files-found: error
          retention-days: 14
