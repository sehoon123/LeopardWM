name: Edge centering and monitor isolation v8

on:
  push:
    branches:
      - agent/edge-centering-monitor-isolation
    paths:
      - .github/workflows/agent-release-edge-centering-v8.yml
      - .github/scripts/apply_edge_centering_monitor_isolation.py

permissions:
  contents: write
  actions: read

concurrency:
  group: edge-centering-monitor-isolation-v8
  cancel-in-progress: false

env:
  SOURCE_BRANCH: agent/edge-centering-monitor-isolation-source
  CONTROL_BRANCH: agent/edge-centering-monitor-isolation
  EXPECTED_MAIN_SHA: 172934972c22984fbc19ae71914fdc928a5ec016
  RELEASE_TAG: v0.2.6-sehoon.8
  RELEASE_VERSION: 0.2.6-sehoon.8

jobs:
  verify-build-publish:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out control files
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_BRANCH }}
          path: control
          fetch-depth: 0

      - name: Check out clean source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          path: source
          fetch-depth: 0

      - name: Record workflow coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='agent_docs/edge-centering-v8-status.json'
          payload=$(jq -n --arg state started --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,run_id:$run_id,run_url:$run_url}')
          content=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CONTROL_BRANCH" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='ci: record v8 release run' -f content="$content" -f branch="$CONTROL_BRANCH")
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply minimal source patch
        working-directory: source
        run: python ../control/.github/scripts/apply_edge_centering_monitor_isolation.py

      - name: Format and inspect patch
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt check failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }
          $changed = @(git diff --name-only)
          $expected = @(
            'crates/core_layout/src/workspace/operations.rs',
            'crates/daemon/src/layout_apply.rs'
          )
          if (@(Compare-Object $changed $expected).Count -ne 0) {
            throw "Unexpected changed files: $($changed -join ', ')"
          }

      - name: Run full locked test suite
        working-directory: source
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy with warnings denied
        working-directory: source
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check every Cargo target
        working-directory: source
        run: cargo check --workspace --all-targets --locked

      - name: Run optimized library and binary tests
        working-directory: source
        run: cargo test --workspace --lib --bins --release --locked

      - name: Stress new edge behavior regressions
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i = 0; $i -lt 12; $i++) {
            cargo test -p leopardwm-core-layout --release --locked edge_centering -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "edge centering stress iteration $i failed" }
            cargo test -p leopardwm-daemon --bin leopardwm --release --locked monitor_isolation -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "monitor isolation stress iteration $i failed" }
          }

      - name: Stress existing geometry regressions
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($filter in @('compositor', 'geometry_mismatch', 'scratchpad', 'floating')) {
            for ($i = 0; $i -lt 4; $i++) {
              cargo test -p leopardwm-daemon --bin leopardwm --release --locked $filter -- --test-threads=1
              if ($LASTEXITCODE -ne 0) { throw "$filter stress iteration $i failed" }
            }
          }

      - name: Build optimized Windows binaries
        working-directory: source
        run: cargo build --workspace --release --locked

      - name: Verify Windows GUI subsystems
        working-directory: source
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1 -RepoRoot (Get-Location).Path

      - name: Install cargo-wix
        run: cargo install cargo-wix --version ^0.3 --locked

      - name: Commit verified source and fast-forward main
        id: source_commit
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/core_layout/src/workspace/operations.rs crates/daemon/src/layout_apply.rs
          git diff --cached --check
          git commit -m 'fix: center edge columns and isolate monitor overflow'
          source_sha=$(git rev-parse HEAD)
          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "$remote_main" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "main changed during validation: expected=$EXPECTED_MAIN_SHA actual=$remote_main" >&2
            exit 1
          fi
          git push origin HEAD:"refs/heads/$SOURCE_BRANCH"
          git push origin HEAD:refs/heads/main
          pushed_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "$pushed_main" != "$source_sha" ]]; then
            echo "main verification failed: expected=$source_sha actual=$pushed_main" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Package ZIP and standalone binaries
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateDirs = @('target/x86_64-pc-windows-msvc/release', 'target/release')
          $binDir = $candidateDirs | Where-Object { Test-Path (Join-Path $_ 'leopardwm.exe') } | Select-Object -First 1
          if (-not $binDir) { throw 'Release binary directory not found' }
          $packageDir = "LeopardWM-$env:RELEASE_VERSION-x86_64-windows"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            $source = Join-Path $binDir $binary
            if (-not (Test-Path $source)) { throw "Missing binary: $source" }
            Copy-Item $source (Join-Path $packageDir $binary)
            Copy-Item $source $binary
          }
          Copy-Item README.md, LICENSE, CHANGELOG.md $packageDir
          7z a "$packageDir.zip" $packageDir | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging failed' }

      - name: Build MSI installer
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo wix -p leopardwm-daemon -I wix/main.wxs --target x86_64-pc-windows-msvc --no-build --nocapture --bin-path 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if ($LASTEXITCODE -ne 0) { throw 'cargo wix failed' }
          $built = Get-ChildItem target/wix/*.msi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $built) { throw 'cargo wix produced no MSI' }
          Copy-Item $built.FullName "LeopardWM-$env:RELEASE_VERSION-x86_64.msi"

      - name: Verify MSI administrative installation
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path "LeopardWM-$env:RELEASE_VERSION-x86_64.msi").Path
          $admin = Join-Path (Get-Location) 'msi-admin-image'
          New-Item -ItemType Directory -Path $admin -Force | Out-Null
          & msiexec.exe /a $msi /qn "TARGETDIR=$admin"
          if ($LASTEXITCODE -ne 0) { throw "MSI administrative install failed: $LASTEXITCODE" }
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            $installed = Get-ChildItem $admin -Recurse -Filter $binary | Select-Object -First 1
            if (-not $installed) { throw "MSI is missing $binary" }
            $expected = (Get-FileHash $binary -Algorithm SHA256).Hash
            $actual = (Get-FileHash $installed.FullName -Algorithm SHA256).Hash
            if ($expected -ne $actual) { throw "MSI binary mismatch: $binary" }
          }

      - name: Generate checksums and release notes
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
            "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip",
            "LeopardWM-$env:RELEASE_VERSION-x86_64.msi",
            'leopardwm.exe',
            'leopardwm-cli.exe',
            'lwm.exe',
            'leopardwm-watchdog.exe'
          )
          $lines = foreach ($asset in $assets) {
            "{0} *{1}" -f (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant(), $asset
          }
          $lines | Set-Content checksums.txt -Encoding ascii
          @'
          Personal-fork prerelease from `sehoon123/LeopardWM`.

          Changes:
          - first and last columns now reach the true viewport center when `centering_mode = "center"` and `center_past_edges = true`
          - animated centering uses the same focus-aware bounds as the settled layout
          - tiled windows that would leak into an adjacent physical monitor are hidden and parked completely outside every monitor
          - floating windows remain free to span monitors intentionally
          - monitor isolation is applied after transition interpolation, so animation frames cannot bypass it

          Validation completed before publication:
          - full workspace/all-target debug tests
          - Clippy with all warnings denied
          - all-target Cargo check
          - optimized library/binary tests
          - repeated edge-centering, monitor-isolation, compositor, geometry, scratchpad, and floating regressions
          - optimized Windows build and GUI subsystem verification
          - MSI administrative installation and binary-identity verification
          '@ | Set-Content release-notes-v8.md -Encoding utf8

      - name: Publish prerelease
        working-directory: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists: $env:RELEASE_TAG" }
          $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($existingTag) { throw "Tag already exists: $env:RELEASE_TAG" }
          gh release create $env:RELEASE_TAG `
            "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip" `
            "LeopardWM-$env:RELEASE_VERSION-x86_64.msi" `
            leopardwm.exe `
            leopardwm-cli.exe `
            lwm.exe `
            leopardwm-watchdog.exe `
            checksums.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SOURCE_SHA `
            --title "LeopardWM $env:RELEASE_TAG — edge centering and monitor isolation" `
            --notes-file release-notes-v8.md `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }

      - name: Independently verify published assets
        working-directory: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $verify = Join-Path (Get-Location) 'published-verification'
          New-Item -ItemType Directory -Path $verify -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $checksumPath = Join-Path $verify 'checksums.txt'
          foreach ($line in Get-Content $checksumPath) {
            if ($line -notmatch '^([0-9a-f]{64}) \*(.+)$') { throw "Invalid checksum line: $line" }
            $path = Join-Path $verify $Matches[2]
            if (-not (Test-Path $path)) { throw "Missing published asset: $($Matches[2])" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" }
          }
          $zip = Join-Path $verify "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip"
          7z t $zip | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Published ZIP CRC verification failed' }
          $extract = Join-Path $verify 'zip-extracted'
          7z x $zip "-o$extract" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Published ZIP extraction failed' }
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            $fromZip = Get-ChildItem $extract -Recurse -Filter $binary | Select-Object -First 1
            $standalone = Join-Path $verify $binary
            if (-not $fromZip) { throw "ZIP is missing $binary" }
            if ((Get-FileHash $fromZip.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $standalone -Algorithm SHA256).Hash) {
              throw "ZIP binary mismatch: $binary"
            }
          }
          $publishedMsi = Join-Path $verify "LeopardWM-$env:RELEASE_VERSION-x86_64.msi"
          $admin = Join-Path $verify 'msi-admin-image'
          New-Item -ItemType Directory -Path $admin -Force | Out-Null
          & msiexec.exe /a $publishedMsi /qn "TARGETDIR=$admin"
          if ($LASTEXITCODE -ne 0) { throw 'Published MSI administrative install failed' }
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            $installed = Get-ChildItem $admin -Recurse -Filter $binary | Select-Object -First 1
            $standalone = Join-Path $verify $binary
            if (-not $installed) { throw "Published MSI is missing $binary" }
            if ((Get-FileHash $installed.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $standalone -Algorithm SHA256).Hash) {
              throw "Published MSI binary mismatch: $binary"
            }
          }
          git fetch origin --tags --force
          $tagSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $mainSha = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($tagSha -ne $env:SOURCE_SHA -or $mainSha -ne $env:SOURCE_SHA) {
            throw "Source identity mismatch: tag=$tagSha main=$mainSha expected=$env:SOURCE_SHA"
          }

      - name: Publish success status
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          set -euo pipefail
          path='agent_docs/edge-centering-v8-status.json'
          zip_hash=$(sha256sum "LeopardWM-$RELEASE_VERSION-x86_64-windows.zip" | awk '{print $1}')
          msi_hash=$(sha256sum "LeopardWM-$RELEASE_VERSION-x86_64.msi" | awk '{print $1}')
          payload=$(jq -n \
            --arg state success \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg zip_sha256 "$zip_hash" \
            --arg msi_sha256 "$msi_hash" \
            '{state:$state,run_id:$run_id,run_url:$run_url,tag:$tag,source_sha:$source_sha,zip_sha256:$zip_sha256,msi_sha256:$msi_sha256}')
          content=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CONTROL_BRANCH" --jq .sha)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='ci: record successful v8 release' \
            -f content="$content" \
            -f branch="$CONTROL_BRANCH" \
            -f sha="$current" >/dev/null

      - name: Upload verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: LeopardWM-v0.2.6-sehoon.8-verified
          path: |
            source/LeopardWM-0.2.6-sehoon.8-x86_64-windows.zip
            source/LeopardWM-0.2.6-sehoon.8-x86_64.msi
            source/checksums.txt
            source/release-notes-v8.md
          if-no-files-found: error
          retention-days: 14
