name: Export source for full audit

on:
  push:
    branches:
      - agent/full-audit-scratchpad-02
    paths:
      - .github/workflows/agent-export-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-audit-scratchpad-02
          fetch-depth: 0

      - name: Create exact source archive
        run: git archive --format=zip --output=LeopardWM-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: LeopardWM-source
          path: LeopardWM-source.zip
          if-no-files-found: error
          retention-days: 1
