name: Export compositor-fix source

on:
  push:
    branches:
      - agent/fix-compositor-desync-v6
    paths:
      - .github/workflows/agent-export-compositor-v6.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-compositor-desync-v6
          fetch-depth: 0
      - run: git archive --format=zip --output=LeopardWM-compositor-v6-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: LeopardWM-compositor-v6-source
          path: LeopardWM-compositor-v6-source.zip
          if-no-files-found: error
          retention-days: 1
