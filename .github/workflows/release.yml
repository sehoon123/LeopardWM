name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A version-coherent v* tag can build only once per Cargo/MSI core. The
    # validator requires exact origin/main provenance and a core bump before
    # any later artifact, including another prerelease suffix.
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy
      - name: Validate release candidate provenance
        shell: pwsh
        run: ./.github/validate-release.ps1 -RepoRoot (Get-Location).Path -Tag $env:GITHUB_REF_NAME
      - name: Install cargo-wix
        run: cargo install cargo-wix --version ^0.3 --locked
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run full test suite
        run: cargo test --workspace --all-targets --locked
      - name: Verify controlled Win32 floating-return probe preflight
        shell: pwsh
        run: ./.github/verify-no-leopardwm-daemon.ps1
      - name: Run controlled Win32 floating-return probe
        run: cargo test -p leopardwm-platform-win32 --features integration-probes --test floating_return_windows --locked -- --test-threads=1
      - name: Verify controlled Win32 preview lifecycle probe preflight
        shell: pwsh
        run: ./.github/verify-no-leopardwm-daemon.ps1
      - name: Run controlled Win32 preview lifecycle probe
        run: cargo test -p leopardwm-platform-win32 --features integration-probes --test preview_lifecycle_windows --locked -- --test-threads=1
      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build optimized binaries
        run: cargo build --workspace --release --locked
      - name: Verify GUI executable subsystems
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1 -RepoRoot (Get-Location).Path
      - name: Package ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          DIR="LeopardWM-${VERSION}-x86_64-windows"
          mkdir "$DIR"
          cp target/x86_64-pc-windows-msvc/release/leopardwm.exe "$DIR/"
          cp target/x86_64-pc-windows-msvc/release/leopardwm-cli.exe "$DIR/"
          cp target/x86_64-pc-windows-msvc/release/lwm.exe "$DIR/"
          cp target/x86_64-pc-windows-msvc/release/leopardwm-watchdog.exe "$DIR/"
          cp README.md LICENSE CHANGELOG.md "$DIR/"
          7z a "${DIR}.zip" "$DIR"
      - name: Build MSI installer
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          cargo wix -p leopardwm-daemon -I wix/main.wxs \
            --target x86_64-pc-windows-msvc \
            --no-build --nocapture \
            --bin-path "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          shopt -s nullglob
          msis=(target/wix/*.msi)
          if [[ ${#msis[@]} -ne 1 ]]; then
            printf 'Expected one MSI from cargo wix, found %s: %s\n' "${#msis[@]}" "${msis[*]:-none}" >&2
            exit 1
          fi
          cp "${msis[0]}" "LeopardWM-${VERSION}-x86_64.msi"
          ls -l "LeopardWM-${VERSION}-x86_64.msi"
      - name: Classify release channel
        id: channel
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # 0.2.7 -> release; 0.2.7-rc1 / 0.2.6-sehoon.17 -> pre-release.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          NOTES=$(awk -v version="$VERSION" '
            $0 == "## " version || $0 == "## [" version "]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [[ -z "$NOTES" ]]; then
            echo "Matching changelog section for $VERSION is empty" >&2
            exit 1
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          sha256sum "LeopardWM-${VERSION}-x86_64-windows.zip" "LeopardWM-${VERSION}-x86_64.msi" > checksums.txt
          cat checksums.txt
      - name: Validate packaged release identities
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          ./.github/validate-release.ps1 -RepoRoot (Get-Location).Path -Tag $env:GITHUB_REF_NAME `
            -ZipPath "LeopardWM-$version-x86_64-windows.zip" `
            -MsiPath "LeopardWM-$version-x86_64.msi" `
            -ChecksumsPath checksums.txt
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            LeopardWM-*.zip
            LeopardWM-*.msi
            checksums.txt
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
