name: Export staged audit patch
# Registration bump for branch-local workflow.

on:
  push:
    branches:
      - agent/full-audit-scratchpad-02
    paths:
      - .github/workflows/agent-export-patch.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/full-audit-scratchpad-02
      - name: Inspect staged patch
        run: |
          wc -c .github/audit/full-audit.patch.gz.b64
          tail -c 80 .github/audit/full-audit.patch.gz.b64 | od -An -tx1c
      - uses: actions/upload-artifact@v4
        with:
          name: staged-audit-patch
          path: .github/audit/full-audit.patch.gz.b64
          if-no-files-found: error
          retention-days: 1
