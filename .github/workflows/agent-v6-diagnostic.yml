name: Capture v6 release diagnostics

on:
  push:
    branches:
      - agent/msi-v6-clean
    paths:
      - .github/workflows/agent-v6-diagnostic.yml
      - .github/audit/trigger-v6-diagnostic

permissions:
  actions: read
  contents: write

concurrency:
  group: v6-diagnostic
  cancel-in-progress: true

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msi-v6-clean
          fetch-depth: 0

      - name: Fetch latest clean2 workflow diagnostics
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $query = 'repos/' + $env:GITHUB_REPOSITORY + '/actions/workflows/agent-msi-v6-clean2.yml/runs?branch=agent%2Fmsi-v6-clean&per_page=10'
          $runs = gh api $query | ConvertFrom-Json
          $run = $runs.workflow_runs | Select-Object -First 1
          if (-not $run) { throw 'No v6 clean2 workflow run found' }
          New-Item -ItemType Directory -Path agent_docs -Force | Out-Null
          @"
          run_id=$($run.id)
          status=$($run.status)
          conclusion=$($run.conclusion)
          html_url=$($run.html_url)
          head_sha=$($run.head_sha)
          "@ | Set-Content -Encoding utf8 agent_docs/v6-release-diagnostic.log
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/jobs?per_page=100" | ConvertFrom-Json
          foreach ($job in $jobs.jobs) {
            Add-Content -Encoding utf8 agent_docs/v6-release-diagnostic.log "`nJOB $($job.id) $($job.status) $($job.conclusion) $($job.name)"
            foreach ($step in $job.steps) {
              Add-Content -Encoding utf8 agent_docs/v6-release-diagnostic.log "STEP $($step.number) $($step.status) $($step.conclusion) $($step.name)"
            }
          }
          if ($run.status -eq 'completed') {
            $zip = Join-Path $env:RUNNER_TEMP 'v6-logs.zip'
            gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/logs" > $zip
            if ((Test-Path $zip) -and ((Get-Item $zip).Length -gt 0)) {
              $out = Join-Path $env:RUNNER_TEMP 'v6-logs'
              Expand-Archive $zip $out -Force
              Get-ChildItem $out -Recurse -File | Sort-Object FullName | ForEach-Object {
                Add-Content -Encoding utf8 agent_docs/v6-release-diagnostic.log "`n===== $($_.Name) ====="
                Get-Content -Raw -ErrorAction SilentlyContinue $_.FullName | Add-Content -Encoding utf8 agent_docs/v6-release-diagnostic.log
              }
            }
          }

      - name: Commit diagnostic snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_docs/v6-release-diagnostic.log
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: capture v6 release diagnostics"
            git push origin HEAD:agent/msi-v6-clean
          }
