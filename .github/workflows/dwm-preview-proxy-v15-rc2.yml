name: Verify DWM preview proxy RC2

on:
  push:
    branches:
      - control/dwm-preview-proxy-v15
    paths:
      - .github/workflows/dwm-preview-proxy-v15-rc2.yml
      - .github/dwm-v15/apply_dwm_preview_proxy_v15.py
      - .github/dwm-v15/harden_dwm_preview_proxy_v15.py

permissions:
  contents: write
  actions: read

concurrency:
  group: dwm-preview-proxy-v15-rc2
  cancel-in-progress: true

env:
  CONTROL_BRANCH: control/dwm-preview-proxy-v15
  SOURCE_BRANCH: fix/dwm-thumbnail-preview-v15c
  EXPECTED_MAIN_SHA: 4b6bb2607a924eab9dd8de7078ba9fd9a6cb8535
  RELEASE_TAG: v0.2.6-sehoon.15-rc2
  RELEASE_VERSION: 0.2.6-sehoon.15-rc2

jobs:
  verify-build-release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out control files
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_BRANCH }}
          path: control
          fetch-depth: 0

      - name: Check out clean product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          path: source
          fetch-depth: 0

      - name: Record workflow coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='agent_docs/dwm-preview-v15-rc2-status.json'
          payload=$(jq -n \
            --arg state started \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg expected_main "$EXPECTED_MAIN_SHA" \
            '{state:$state,run_id:$run_id,run_url:$run_url,expected_main:$expected_main}')
          content=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CONTROL_BRANCH" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='ci: record DWM preview RC2 run' -f content="$content" -f branch="$CONTROL_BRANCH")
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply and harden the DWM preview backend
        working-directory: source
        run: |
          python ../control/.github/dwm-v15/apply_dwm_preview_proxy_v15.py
          python ../control/.github/dwm-v15/harden_dwm_preview_proxy_v15.py

      - name: Format and validate the exact product diff
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt check failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }
          $allowed = @(
            'crates/platform_win32/src/placement.rs',
            'crates/platform_win32/src/thumbnail.rs'
          )
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($changed.Count -ne 2 -or $unexpected.Count -ne 0) {
            throw "Unexpected changed files: $($changed -join ', ')"
          }

      - name: Verify backend contracts
        working-directory: source
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          placement = Path('crates/platform_win32/src/placement.rs').read_text(encoding='utf-8')
          thumbnail = Path('crates/platform_win32/src/thumbnail.rs').read_text(encoding='utf-8')
          combined = placement + '\n' + thumbnail
          required = {
              'DWM source crop': 'DWM_TNP_RECTSOURCE',
              'real source parking': 'preview_source: true',
              'post-position uncloak': 'uncloak_preview_sources(&committed_preview_requests)',
              'first activation flush': 'preview_commit_needs_flush(',
              'successful request filter': 'committed_preview_requests',
              'failed move region preservation': 'preserved_region_ids',
              'virtual-screen host origin': 'let origin = host().origin();',
              'Explorer support': 'class == "CabinetWClass"',
              'Notepad support': 'class == "Notepad"',
              'no per-frame flush': 'existing animation frames do not',
          }
          missing = [name for name, marker in required.items() if marker not in combined]
          forbidden = [
              'publish_persistent_previews(&preview_requests)',
              'apply_window_region_clip(',
              'prepare_window_region_clip(',
          ]
          present = [marker for marker in forbidden if marker in placement]
          if missing:
              raise SystemExit('Missing DWM proxy contracts: ' + ', '.join(missing))
          if present:
              raise SystemExit('Legacy foreign-HWND region path remains active: ' + ', '.join(present))
          print('DWM preview RC2 contracts: OK')
          '@ | python -

      - name: Run focused preview tests first
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p leopardwm-platform-win32 persistent_preview_geometry_tests --locked -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'thumbnail geometry tests failed' }
          cargo test -p leopardwm-platform-win32 persistent_preview_placement_tests --locked -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'preview placement tests failed' }
          cargo test -p leopardwm-platform-win32 window_region --locked -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'legacy region recovery tests failed' }

      - name: Run full locked test suite
        working-directory: source
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy with warnings denied
        working-directory: source
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check every Cargo target
        working-directory: source
        run: cargo check --workspace --all-targets --locked

      - name: Run optimized tests
        working-directory: source
        run: cargo test --workspace --lib --bins --tests --release --locked

      - name: Stress preview and rendering regressions
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i = 0; $i -lt 6; $i++) {
            cargo test -p leopardwm-platform-win32 --release --locked persistent_preview -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "persistent preview iteration $i failed" }
          }
          foreach ($filter in @('window_region', 'focus_mode_preview_tests', 'geometry_mismatch', 'compositor', 'scratchpad', 'floating')) {
            for ($i = 0; $i -lt 2; $i++) {
              cargo test --workspace --release --locked $filter -- --test-threads=1
              if ($LASTEXITCODE -ne 0) { throw "$filter iteration $i failed" }
            }
          }

      - name: Build optimized Windows binaries
        working-directory: source
        run: cargo build --workspace --release --locked

      - name: Verify Windows GUI subsystems
        working-directory: source
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1 -RepoRoot (Get-Location).Path

      - name: Install cargo-wix
        run: cargo install cargo-wix --version ^0.3 --locked

      - name: Build and verify MSI
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo wix -p leopardwm-daemon -I wix/main.wxs --target x86_64-pc-windows-msvc --no-build --nocapture --bin-path 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if ($LASTEXITCODE -ne 0) { throw 'cargo wix failed' }
          $built = Get-ChildItem target/wix/*.msi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $built) { throw 'cargo wix produced no MSI' }
          $msiName = "LeopardWM-$env:RELEASE_VERSION-x86_64.msi"
          Copy-Item $built.FullName $msiName

          $admin = Join-Path (Get-Location) 'msi-admin-image'
          New-Item -ItemType Directory -Path $admin -Force | Out-Null
          $msi = (Resolve-Path $msiName).Path
          $arguments = "/a `"$msi`" /qn TARGETDIR=`"$admin`""
          $process = Start-Process "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI administrative install failed: $($process.ExitCode)" }

          $binDir = @('target/x86_64-pc-windows-msvc/release', 'target/release') |
            Where-Object { Test-Path (Join-Path $_ 'leopardwm.exe') } |
            Select-Object -First 1
          if (-not $binDir) { throw 'Release binary directory not found' }
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            $installed = Get-ChildItem $admin -Recurse -Filter $binary | Select-Object -First 1
            if (-not $installed) { throw "MSI is missing $binary" }
            if ((Get-FileHash $installed.FullName -Algorithm SHA256).Hash -ne (Get-FileHash (Join-Path $binDir $binary) -Algorithm SHA256).Hash) {
              throw "MSI binary mismatch: $binary"
            }
          }

      - name: Commit verified product source
        id: source_commit
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/platform_win32/src/placement.rs crates/platform_win32/src/thumbnail.rs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged diff check failed' }
          git commit -m 'fix: proxy monitor-edge previews through DWM thumbnails'
          if ($LASTEXITCODE -ne 0) { throw 'source commit failed' }
          $candidate = (git rev-parse HEAD).Trim()
          git push origin HEAD:refs/heads/$env:SOURCE_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'source branch push failed' }
          $remoteMain = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($remoteMain -ne $env:EXPECTED_MAIN_SHA) {
            throw "main changed during RC verification: expected=$env:EXPECTED_MAIN_SHA actual=$remoteMain"
          }
          "sha=$candidate" >> $env:GITHUB_OUTPUT

      - name: Package portable ZIP and checksums
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = @('target/x86_64-pc-windows-msvc/release', 'target/release') |
            Where-Object { Test-Path (Join-Path $_ 'leopardwm.exe') } |
            Select-Object -First 1
          if (-not $binDir) { throw 'Release binary directory not found' }
          $packageDir = "LeopardWM-$env:RELEASE_VERSION-x86_64-windows"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            Copy-Item (Join-Path $binDir $binary) (Join-Path $packageDir $binary)
          }
          Copy-Item README.md, LICENSE, CHANGELOG.md $packageDir
          $zipName = "$packageDir.zip"
          7z a $zipName $packageDir | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging failed' }
          $msiName = "LeopardWM-$env:RELEASE_VERSION-x86_64.msi"
          @($zipName, $msiName) | ForEach-Object {
            "{0} *{1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant(), $_
          } | Set-Content checksums.txt -Encoding ascii
          @'
          Diagnostic prerelease for real multi-monitor validation.

          This RC replaces SetWindowRgn-based side previews with cropped DWM thumbnails:
          - the real non-focused HWND is moved outside every physical monitor
          - its placement cloak is removed only after that safe synchronous landing
          - the cropped thumbnail becomes visible only after DwmFlush confirms a new source landing
          - existing previews avoid a per-animation-frame DwmFlush stall
          - failed source moves retain older safety state and never publish a thumbnail
          - Explorer, modern Notepad, WinUI and DirectComposition windows no longer rely on foreign-HWND region clipping

          The RC remains off main until Explorer and Notepad are verified on physical multi-monitor hardware.
          '@ | Set-Content release-notes-v15-rc2.md -Encoding utf8

      - name: Publish prerelease
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "LeopardWM-$RELEASE_VERSION-x86_64-windows.zip" \
            "LeopardWM-$RELEASE_VERSION-x86_64.msi" \
            checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "LeopardWM $RELEASE_TAG — DWM monitor preview proxy" \
            --notes-file release-notes-v15-rc2.md \
            --prerelease

      - name: Independently verify published assets
        working-directory: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $verify = Join-Path (Get-Location) 'published-verification'
          New-Item -ItemType Directory -Path $verify -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          foreach ($line in Get-Content (Join-Path $verify 'checksums.txt')) {
            if ($line -notmatch '^([0-9a-f]{64}) \*(.+)$') { throw "Invalid checksum line: $line" }
            $path = Join-Path $verify $Matches[2]
            if (-not (Test-Path $path)) { throw "Missing asset: $($Matches[2])" }
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches[1]) {
              throw "Checksum mismatch: $($Matches[2])"
            }
          }
          $zip = Join-Path $verify "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip"
          7z t $zip | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Published ZIP CRC check failed' }

          $msi = Join-Path $verify "LeopardWM-$env:RELEASE_VERSION-x86_64.msi"
          $admin = Join-Path $verify 'msi-admin-image'
          New-Item -ItemType Directory -Path $admin -Force | Out-Null
          $arguments = "/a `"$msi`" /qn TARGETDIR=`"$admin`""
          $process = Start-Process "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published MSI install failed: $($process.ExitCode)" }

          git fetch origin --tags --force
          $tagSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $branchSha = ((git ls-remote origin "refs/heads/$env:SOURCE_BRANCH") -split '\s+')[0]
          if ($tagSha -ne $env:SOURCE_SHA -or $branchSha -ne $env:SOURCE_SHA) {
            throw "Source identity mismatch: tag=$tagSha branch=$branchSha expected=$env:SOURCE_SHA"
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,url | Out-Host

      - name: Publish success status
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          set -euo pipefail
          path='agent_docs/dwm-preview-v15-rc2-status.json'
          zip_hash=$(sha256sum "LeopardWM-$RELEASE_VERSION-x86_64-windows.zip" | awk '{print $1}')
          msi_hash=$(sha256sum "LeopardWM-$RELEASE_VERSION-x86_64.msi" | awk '{print $1}')
          payload=$(jq -n \
            --arg state success \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg zip_sha256 "$zip_hash" \
            --arg msi_sha256 "$msi_hash" \
            '{state:$state,run_id:$run_id,run_url:$run_url,tag:$tag,source_sha:$source_sha,zip_sha256:$zip_sha256,msi_sha256:$msi_sha256}')
          content=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CONTROL_BRANCH" --jq .sha)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='ci: record successful DWM preview RC2' \
            -f content="$content" -f branch="$CONTROL_BRANCH" -f sha="$current" >/dev/null

      - name: Publish failure status
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='agent_docs/dwm-preview-v15-rc2-status.json'
          payload=$(jq -n --arg state failure --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,run_id:$run_id,run_url:$run_url}')
          content=$(printf '%s\n' "$payload" | base64 -w0)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CONTROL_BRANCH" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='ci: record failed DWM preview RC2' -f content="$content" -f branch="$CONTROL_BRANCH")
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null

      - name: Upload verified RC bundle
        uses: actions/upload-artifact@v4
        with:
          name: LeopardWM-v0.2.6-sehoon.15-rc2-verified
          path: |
            source/LeopardWM-0.2.6-sehoon.15-rc2-x86_64-windows.zip
            source/LeopardWM-0.2.6-sehoon.15-rc2-x86_64.msi
            source/checksums.txt
            source/release-notes-v15-rc2.md
          if-no-files-found: error
          retention-days: 14
