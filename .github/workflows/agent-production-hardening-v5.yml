name: Production hardening v5

on:
  push:
    branches:
      - agent/performance-audit-03
    paths:
      - .github/workflows/agent-production-hardening-v5.yml
      - .github/scripts/apply_production_hardening_v5.py
      - .github/audit/trigger-production-hardening-v5

permissions:
  contents: write

concurrency:
  group: production-hardening-v5
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.2.6-sehoon.5
  RELEASE_VERSION: 0.2.6-sehoon.5

jobs:
  verify-build-release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/performance-audit-03
          fetch-depth: 0

      - name: Install stable Rust with quality components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply production hardening
        run: python .github/scripts/apply_production_hardening_v5.py

      - name: Repair generated animation capacity bound
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'crates/daemon/src/transitions.rs'
          $text = Get-Content -Raw -Encoding utf8 $path
          $old = 'Vec::with_capacity(placements.len().min(ghosted.len()))'
          $new = 'Vec::with_capacity(placements.len().min(ghost_handles.len()))'
          if (-not $text.Contains($old)) {
            throw 'Expected generated ghost capacity expression was not found'
          }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

      - name: Refresh lockfile for intentional manifest changes
        run: cargo check -p leopardwm-core-layout

      - name: Format source
        run: cargo fmt --all

      - name: Verify formatting and patch hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt check failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }

      - name: Verify structural invariants
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          root = Path('.')
          cargo = (root / 'crates/cli/Cargo.toml').read_text(encoding='utf-8')
          assert cargo.count('path = "src/main.rs"') == 1, cargo
          assert 'path = "src/bin/lwm.rs"' in cargo, cargo
          assert (root / 'crates/cli/src/lib.rs').is_file()
          assert (root / 'crates/cli/src/bin/lwm.rs').is_file()
          html_rs = (root / 'crates/daemon/src/settings/html.rs').read_text(encoding='utf-8')
          assert 'include_str!("settings.html")' in html_rs
          assert (root / 'crates/daemon/src/settings/settings.html').stat().st_size > 50_000
          atomic = (root / 'crates/daemon/src/atomic_file.rs').read_text(encoding='utf-8')
          assert 'MOVEFILE_WRITE_THROUGH' in atomic
          assert 'sync_all()' in atomic
          assert any('atomic_file::write(' in p.read_text(encoding='utf-8', errors='replace')
                     for p in (root / 'crates/daemon/src').rglob('*.rs') if p.name != 'atomic_file.rs')
          print('structural invariants: OK')
          '@ | python -

      - name: Run full locked test suite for every target
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy for every target with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check every Cargo target
        run: cargo check --workspace --all-targets --locked

      - name: Run optimized library and binary tests
        run: cargo test --workspace --lib --bins --release --locked

      - name: Stress scratchpad and floating regressions in release mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i = 0; $i -lt 8; $i++) {
            cargo test -p leopardwm-daemon --bin leopardwm --release --locked scratchpad -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "scratchpad stress iteration $i failed" }
            cargo test -p leopardwm-daemon --bin leopardwm --release --locked floating -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "floating stress iteration $i failed" }
          }

      - name: Build optimized Windows binaries
        run: cargo build --workspace --release --locked

      - name: Verify Windows GUI subsystems
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1

      - name: Commit and push only verified production source
        id: source_commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Do not modify workflow files from GITHUB_TOKEN. That can be rejected even
          # with contents:write and previously left the release pointing at no remote commit.
          Remove-Item agent_docs/README.tmp -ErrorAction SilentlyContinue
          Remove-Item agent_docs/control-note.tmp -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged source failed diff check' }
          $staged = git diff --cached --name-only
          if (-not $staged) { throw 'No verified production source changes were generated' }
          git commit -m "perf: harden persistence and remove hot-path duplication"
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          $localSha = (git rev-parse HEAD).Trim()
          git push origin HEAD:refs/heads/agent/performance-audit-03
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
          $remoteLine = git ls-remote origin refs/heads/agent/performance-audit-03
          if ($LASTEXITCODE -ne 0 -or -not $remoteLine) { throw 'Could not resolve pushed remote branch' }
          $remoteSha = (($remoteLine -split '\s+')[0]).Trim()
          if ($remoteSha -ne $localSha) {
            throw "Remote branch mismatch: local=$localSha remote=$remoteSha"
          }
          "sha=$localSha" >> $env:GITHUB_OUTPUT
          Write-Host "Verified remote source commit: $localSha"

      - name: Package binaries and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateDirs = @('target/x86_64-pc-windows-msvc/release', 'target/release')
          $binDir = $candidateDirs | Where-Object { Test-Path (Join-Path $_ 'leopardwm.exe') } | Select-Object -First 1
          if (-not $binDir) { throw 'Release binary directory not found' }
          $packageDir = "LeopardWM-$env:RELEASE_VERSION-x86_64-windows"
          $zipPath = "$packageDir.zip"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          $binaries = @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')
          foreach ($binary in $binaries) {
            $source = Join-Path $binDir $binary
            if (-not (Test-Path $source)) { throw "Missing binary: $source" }
            Copy-Item $source (Join-Path $packageDir $binary)
            Copy-Item $source $binary
          }
          Copy-Item README.md, LICENSE, agent_docs/production-hardening-v0.2.6-sehoon.5.md $packageDir
          Compress-Archive -Path $packageDir -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $assets = @($zipPath) + $binaries + @('agent_docs/production-hardening-v0.2.6-sehoon.5.md')
          $checksumLines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash *$asset"
          }
          $checksumLines | Set-Content -Encoding ascii checksums.txt
          Get-Content checksums.txt

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          Personal-fork prerelease from `sehoon123/LeopardWM`.

          Production hardening pass:
          - splits the duplicated CLI implementation into one shared library plus two thin binaries
          - moves the large Settings HTML/CSS/JS document out of the Rust token stream while keeping it embedded with include_str!
          - reduces common layout-frame heap allocation with exact capacity reservation and inline SmallVec scratch storage
          - makes configuration/session persistence crash-safe with flushed sibling files and Win32 write-through replacement
          - retries transient antivirus/sharing-lock replacement failures without exposing partial state
          - expands validation to all Cargo targets and serializes publication
          - preserves and repeatedly exercises scratchpad/floating size regression coverage

          Validation completed before publication:
          - formatting and patch hygiene
          - full debug tests for all workspace targets
          - Clippy for all targets with warnings denied
          - all-target Cargo check
          - optimized library and binary tests
          - repeated release-mode scratchpad/floating regression tests
          - optimized Windows build
          - GUI subsystem verification
          - remote source-commit identity verification after push

          This release exists only in the user fork. Nothing was sent upstream.
          '@ | Set-Content -Encoding utf8 release-notes-v5.md

      - name: Publish tested binaries to this fork
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SOURCE_SHA) { throw 'Verified source SHA is empty' }
          gh release create $env:RELEASE_TAG `
            "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip" `
            leopardwm.exe `
            leopardwm-cli.exe `
            lwm.exe `
            leopardwm-watchdog.exe `
            checksums.txt `
            agent_docs/production-hardening-v0.2.6-sehoon.5.md `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SOURCE_SHA `
            --title "LeopardWM $env:RELEASE_TAG — production hardening" `
            --notes-file release-notes-v5.md `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }

      - name: Verify published release and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read newly published release' }
          if ($release.tagName -ne $env:RELEASE_TAG) { throw 'Release tag mismatch' }
          if ($release.isDraft) { throw 'Release remained a draft' }
          if (-not $release.isPrerelease) { throw 'Expected prerelease flag' }
          $tagSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:SOURCE_SHA) {
            throw "Published tag does not identify verified source: tag=$tagSha source=$env:SOURCE_SHA"
          }
          $expected = @(
            "LeopardWM-$env:RELEASE_VERSION-x86_64-windows.zip",
            'leopardwm.exe',
            'leopardwm-cli.exe',
            'lwm.exe',
            'leopardwm-watchdog.exe',
            'checksums.txt',
            'production-hardening-v0.2.6-sehoon.5.md'
          )
          $actual = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in $expected) {
            if ($name -notin $actual) { throw "Missing release asset: $name" }
          }
          Write-Host "Published and verified $env:RELEASE_TAG at $tagSha"
