name: Install DWM preview cleanup hook

on:
  push:
    branches:
      - control/dwm-preview-proxy-v15
    paths:
      - .github/workflows/install-dwm-preview-cleanup-hook-v15.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control/dwm-preview-proxy-v15
          fetch-depth: 0

      - name: Chain the focused cleanup after proxy hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/dwm-v15/harden_dwm_preview_proxy_v15.py')
          text = path.read_text(encoding='utf-8')
          hook = "\nexec(\n    Path(__file__).with_name('cleanup_legacy_region_v15.py').read_text(encoding='utf-8'),\n    {'__name__': '__main__'},\n)\n"
          if "cleanup_legacy_region_v15.py" in text:
              raise SystemExit('cleanup hook is already installed')
          path.write_text(text.rstrip() + hook, encoding='utf-8', newline='\n')
          PY
          python -m py_compile .github/dwm-v15/harden_dwm_preview_proxy_v15.py
          git diff --check

      - name: Commit the cleanup hook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/dwm-v15/harden_dwm_preview_proxy_v15.py
          git commit -m 'ci: run legacy-region cleanup after DWM proxy hardening'
          git push origin HEAD:refs/heads/control/dwm-preview-proxy-v15
