name: Compositor-safe v6 clean release

on:
  push:
    branches: [agent/fix-compositor-desync-v6]
    paths: [.github/workflows/agent-compositor-safe-v6-release-clean.yml]

permissions:
  contents: write

concurrency:
  group: compositor-safe-v6-clean-release
  cancel-in-progress: false

env:
  BASE_SHA: bf08d4f6969032d17bbde70266eccccbc27b621a
  SOURCE_BRANCH: agent/compositor-safe-v6-source
  RELEASE_TAG: v0.2.6-sehoon.6
  RELEASE_VERSION: 0.2.6-sehoon.6
  PATCH_SHA256: 7e0628a71f2f628c71ed620be7596ff600d8b12a57866cecac6fe60564dfd345

jobs:
  verify-build-release:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out release-control branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-compositor-desync-v6
          fetch-depth: 0

      - name: Reconstruct reviewed patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = '.github/audit'
          $first = (Get-Content -Raw -Encoding ascii "$dir/compositor-v6.patch.b64.00").Trim()
          if ($first.Length -lt 7000) { throw 'Patch chunk 00 is too short' }
          $encoded = $first.Substring(0, 7000)
          foreach ($i in 1..5) {
            $encoded += (Get-Content -Raw -Encoding ascii ("$dir/compositor-v6.patch.b64.{0:D2}" -f $i)).Trim()
          }
          $bytes = [Convert]::FromBase64String($encoded)
          $patch = Join-Path $env:RUNNER_TEMP 'compositor-v6-reviewed.patch'
          [IO.File]::WriteAllBytes($patch, $bytes)
          $actual = (Get-FileHash -Algorithm SHA256 $patch).Hash.ToLowerInvariant()
          if ($actual -ne $env:PATCH_SHA256) {
            throw "Reviewed patch hash mismatch: expected=$env:PATCH_SHA256 actual=$actual"
          }
          "PATCH_PATH=$patch" >> $env:GITHUB_ENV
          Write-Host "Reviewed patch verified: $($bytes.Length) bytes / $actual"

      - name: Apply patch and repair the two context-only rejects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git checkout --detach $env:BASE_SHA
          git reset --hard $env:BASE_SHA
          git clean -fdx
          git apply --reject --whitespace=fix $env:PATCH_PATH
          $applyExit = $LASTEXITCODE
          $rejects = @(Get-ChildItem -Recurse -Filter '*.rej' | ForEach-Object { $_.FullName.Replace((Get-Location).Path + '\', '').Replace('\','/') })
          $expectedRejects = @('crates/daemon/src/config.rs.rej','crates/platform_win32/src/thumbnail.rs.rej')
          if ($applyExit -eq 0 -or (Compare-Object $rejects $expectedRejects)) {
            throw "Unexpected patch result. exit=$applyExit rejects=$($rejects -join ',')"
          }
          @'
          from pathlib import Path

          config = Path('crates/daemon/src/config.rs')
          text = config.read_text(encoding='utf-8')
          old = '''            [behavior]
                      cross_monitor_drag = false
                      drag_to_merge = false
                      "#,
          '''
          # The source uses twelve spaces in the embedded TOML. Match without
          # relying on the rejected hunk's surrounding line numbers.
          old = old.replace('                      ', '            ')
          new = old.replace('            "#,', '            compositor_safe_mode = false\n            "#,')
          if old not in text:
              raise SystemExit('config repair anchor not found')
          config.write_text(text.replace(old, new, 1), encoding='utf-8')

          thumbnail = Path('crates/platform_win32/src/thumbnail.rs')
          text = thumbnail.read_text(encoding='utf-8')
          start = text.index('/// Predicate: does this window\'s class belong to a family that renders poorly')
          end = text.index('/// Read the class name of a window.', start)
          replacement = '''/// Predicate: does this top-level window belong to a renderer family whose
          /// client surface can desynchronize from the outer HWND after repeated moves?
          ///
          /// This list is used only for targeted landing refreshes and for the optional
          /// legacy thumbnail path. Compositor-safe mode itself is class-agnostic and
          /// avoids per-frame live HWND movement for every application.
          pub fn is_compositor_sensitive_class(wid: WindowId) -> bool {
              is_compositor_sensitive_class_str(&class_name(wid))
          }

          /// String variant of [`is_compositor_sensitive_class`] for callers that have
          /// already read the class name (avoids a redundant `GetClassNameW` call).
          pub fn is_compositor_sensitive_class_str(class: &str) -> bool {
              class.starts_with("Chrome_WidgetWin_")
                  || class == "MozillaWindowClass"
                  || class == "CASCADIA_HOSTING_WINDOW_CLASS"
                  || class.starts_with("WindowsForms10.")
                  || class.starts_with("HwndWrapper")
                  || class == "CabinetWClass"
                  || class == "ExploreWClass"
                  || class == "ApplicationFrameWindow"
                  || class == "WinUIDesktopWin32WindowClass"
                  || class == "CEF-OSC-WIDGET"
                  || class.starts_with("Qt5QWindow")
                  || class.starts_with("Qt6QWindow")
          }

          /// Backward-compatible name for the experimental thumbnail eligibility check.
          pub fn is_ghost_animation_class(wid: WindowId) -> bool {
              is_compositor_sensitive_class(wid)
          }

          /// Backward-compatible string variant used by existing daemon call sites.
          pub fn is_ghost_animation_class_str(class: &str) -> bool {
              is_compositor_sensitive_class_str(class)
          }

          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          thumbnail.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          for reject in Path('.').rglob('*.rej'):
              reject.unlink()
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Patch repair failed' }
          if (Get-ChildItem -Recurse -Filter '*.rej') { throw 'Reject files remain after repair' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patched source failed diff check' }

      - name: Install Rust quality components
        shell: pwsh
        run: |
          rustup toolchain install stable --component rustfmt --component clippy --profile minimal --no-self-update
          rustup default stable

      - name: Format and verify structural invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt check failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }
          @'
          from pathlib import Path
          config = Path('crates/daemon/src/config.rs').read_text(encoding='utf-8')
          transitions = Path('crates/daemon/src/transitions.rs').read_text(encoding='utf-8')
          apply = Path('crates/daemon/src/layout_apply.rs').read_text(encoding='utf-8')
          placement = Path('crates/platform_win32/src/placement.rs').read_text(encoding='utf-8')
          thumbnail = Path('crates/platform_win32/src/thumbnail.rs').read_text(encoding='utf-8')
          settings = Path('crates/daemon/src/settings/settings.html').read_text(encoding='utf-8')
          assert 'pub compositor_safe_mode: bool' in config
          assert 'settle_animations_for_compositor_safety' in transitions
          assert 'if self.settle_animations_for_compositor_safety()' in apply
          assert 'flags |= SWP_NOSIZE' in placement
          assert 'is_compositor_sensitive_class_str' in thumbnail
          assert 'behavior-compositor_safe_mode' in settings
          print('Compositor-safe invariants: OK')
          '@ | python -

      - name: Full debug tests
        run: cargo test --workspace --all-targets --locked

      - name: Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check every Cargo target
        run: cargo check --workspace --all-targets --locked

      - name: Optimized tests
        run: cargo test --workspace --lib --bins --release --locked

      - name: Repeat compositor and geometry regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($iteration in 1..5) {
            foreach ($filter in @('compositor_safe','scratchpad','floating')) {
              cargo test -p leopardwm-daemon --bin leopardwm --release --locked $filter -- --test-threads=1
              if ($LASTEXITCODE -ne 0) { throw "$filter regression iteration $iteration failed" }
            }
          }

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Verify GUI executable subsystems
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1

      - name: Build and validate MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo install cargo-wix --version ^0.3 --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo-wix install failed' }
          $wixBin = @('C:\Program Files (x86)\WiX Toolset v3.14\bin','C:\Program Files (x86)\WiX Toolset v3.11\bin') |
            Where-Object { Test-Path (Join-Path $_ 'candle.exe') } | Select-Object -First 1
          if (-not $wixBin) { throw 'WiX v3 not found' }
          cargo wix -p leopardwm-daemon -I wix/main.wxs --target x86_64-pc-windows-msvc --no-build --nocapture --bin-path "$wixBin"
          if ($LASTEXITCODE -ne 0) { throw 'cargo wix failed' }
          $built = Get-ChildItem target/wix/*.msi | Select-Object -First 1
          if (-not $built) { throw 'MSI output missing' }
          $msi = "LeopardWM-$env:RELEASE_VERSION-x86_64.msi"
          Copy-Item $built.FullName $msi -Force
          if ((Get-Item $msi).Length -lt 1000000) { throw 'MSI unexpectedly small' }
          $admin = Join-Path $env:RUNNER_TEMP 'msi-admin'
          New-Item -ItemType Directory -Path $admin -Force | Out-Null
          $log = Join-Path $env:RUNNER_TEMP 'msi-admin.log'
          $proc = Start-Process msiexec.exe -ArgumentList @('/a',"`"$((Resolve-Path $msi).Path)`"",'/qn',"TARGETDIR=`"$admin`"",'/l*v',"`"$log`"") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Get-Content $log -Tail 100; throw "MSI validation failed: $($proc.ExitCode)" }
          foreach ($binary in @('leopardwm.exe','leopardwm-cli.exe','lwm.exe','leopardwm-watchdog.exe')) {
            if (-not (Get-ChildItem $admin -Recurse -Filter $binary -File)) { throw "MSI missing $binary" }
          }
          "RELEASE_MSI=$msi" >> $env:GITHUB_ENV

      - name: Commit verified source
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md crates
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged source failed diff check' }
          git commit -m 'fix: prevent compositor surface drift during navigation'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
          $sha = (git rev-parse HEAD).Trim()
          git push --force origin "HEAD:refs/heads/$env:SOURCE_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Source branch push failed' }
          $remote = ((git ls-remote origin "refs/heads/$env:SOURCE_BRANCH") -split '\s+')[0].Trim()
          if ($remote -ne $sha) { throw "Remote/source mismatch: $remote != $sha" }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = @('target/x86_64-pc-windows-msvc/release','target/release') |
            Where-Object { Test-Path (Join-Path $_ 'leopardwm.exe') } | Select-Object -First 1
          if (-not $binDir) { throw 'Release binary directory not found' }
          $dir = "LeopardWM-$env:RELEASE_VERSION-x86_64-windows"
          $zip = "$dir.zip"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $binaries = @('leopardwm.exe','leopardwm-cli.exe','lwm.exe','leopardwm-watchdog.exe')
          foreach ($binary in $binaries) {
            Copy-Item (Join-Path $binDir $binary) (Join-Path $dir $binary) -Force
            Copy-Item (Join-Path $binDir $binary) $binary -Force
          }
          Copy-Item README.md,LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath $zip -CompressionLevel Optimal -Force
          $assets = @($zip,$env:RELEASE_MSI) + $binaries
          foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash *$asset"
          } | Set-Content -Encoding ascii checksums.txt
          "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV
          Get-Content checksums.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG") { throw 'Release tag already exists' }
          @'
          This personal-fork prerelease enables compositor-safe window movement by default. Active live-window animations are collapsed at the central frame-dispatch boundary into one exact synchronous landing, removing the asynchronous SetWindowPos burst that can desynchronize DirectComposition and swap-chain client surfaces from their outer HWND frames.

          The opt-out legacy path now uses SWP_NOSIZE for position-only frames and performs a broader final renderer refresh. Existing configuration remains compatible; set `behavior.compositor_safe_mode = false` only to restore legacy live-window animation.
          '@ | Set-Content -Encoding utf8 release-notes-v6.md
          gh release create $env:RELEASE_TAG $env:RELEASE_ZIP $env:RELEASE_MSI leopardwm.exe leopardwm-cli.exe lwm.exe leopardwm-watchdog.exe checksums.txt `
            --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --title "LeopardWM $env:RELEASE_TAG — compositor-safe movement" `
            --notes-file release-notes-v6.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

      - name: Verify release and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG"
          $tagSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($tagSha -ne $env:SOURCE_SHA) { throw "Tag/source mismatch: $tagSha != $env:SOURCE_SHA" }
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($release.tagName -ne $env:RELEASE_TAG -or $release.isDraft -or -not $release.isPrerelease) { throw 'Release metadata invalid' }
          $expected = @($env:RELEASE_ZIP,$env:RELEASE_MSI,'leopardwm.exe','leopardwm-cli.exe','lwm.exe','leopardwm-watchdog.exe','checksums.txt') | ForEach-Object { Split-Path $_ -Leaf }
          $actual = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in $expected) { if ($name -notin $actual) { throw "Missing release asset: $name" } }
          [ordered]@{tag=$env:RELEASE_TAG; source_sha=$env:SOURCE_SHA; tag_sha=$tagSha; assets=$actual; checksums=Get-Content checksums.txt} |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 verification-report.json

      - name: Upload verified bundle
        uses: actions/upload-artifact@v4
        with:
          name: LeopardWM-v0.2.6-sehoon.6-verified
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_MSI }}
            leopardwm.exe
            leopardwm-cli.exe
            lwm.exe
            leopardwm-watchdog.exe
            checksums.txt
            verification-report.json
          if-no-files-found: error
          retention-days: 7
