name: Fix window-region type handling v12

on:
  push:
    branches:
      - agent/window-region-clipping-v12-control
    paths:
      - .github/workflows/agent-fix-window-region-kind-v12.yml

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/window-region-clipping-v12-source
          fetch-depth: 0

      - name: Use the GDI region newtype correctly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/platform_win32/src/window_region.rs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '''    let kind = unsafe { GetWindowRgn(hwnd, region) };
              delete_region(region);
              kind
          }''': '''    let kind = unsafe { GetWindowRgn(hwnd, region) };
              delete_region(region);
              kind.0
          }''',
              '''    let kind = unsafe { GetWindowRgn(hwnd, actual) };
              if kind <= NULL_REGION_KIND {''': '''    let kind = unsafe { GetWindowRgn(hwnd, actual) };
              if kind.0 <= NULL_REGION_KIND {''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected GDI region block: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/platform_win32/src/window_region.rs
          git commit -m 'fix: unwrap GDI region type values explicitly'
          git push origin HEAD:refs/heads/agent/window-region-clipping-v12-source
