name: Fix window-region Clippy findings v12

on:
  push:
    branches:
      - agent/window-region-clipping-v12-control
    paths:
      - .github/workflows/agent-fix-window-region-kind-v12.yml

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/window-region-clipping-v12-source
          fetch-depth: 0

      - name: Collapse the two guarded recovery conditions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/platform_win32/src/window_region.rs')
          text = path.read_text(encoding='utf-8')

          old_apply = '''        if has_owner_marker(hwnd) {
              if state.identity == current_identity
                  && actual_region_matches(hwnd, state.expected_region)
              {
                  if !clear_region(hwnd, false) {
                      lock_states().insert(window_id, state);
                      return RegionClipResult::Failed;
                  }
              }
              remove_metadata(hwnd);
          }'''
          new_apply = '''        if has_owner_marker(hwnd) {
              if state.identity == current_identity
                  && actual_region_matches(hwnd, state.expected_region)
                  && !clear_region(hwnd, false)
              {
                  lock_states().insert(window_id, state);
                  return RegionClipResult::Failed;
              }
              remove_metadata(hwnd);
          }'''

          old_restore = '''    if actual_region_matches(hwnd, expected) {
              if !clear_region(hwnd, redraw) {
                  return false;
              }
          }'''
          new_restore = '''    if actual_region_matches(hwnd, expected) && !clear_region(hwnd, redraw) {
              return false;
          }'''

          for label, old, new in [
              ('apply recovery', old_apply, new_apply),
              ('restore recovery', old_restore, new_restore),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected {label} block')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Commit the focused correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/platform_win32/src/window_region.rs
          git commit -m 'style: satisfy clippy in window-region recovery'
          git push origin HEAD:refs/heads/agent/window-region-clipping-v12-source
