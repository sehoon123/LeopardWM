name: Fix window-region test contract v12

on:
  push:
    branches:
      - agent/window-region-clipping-v12-control
    paths:
      - .github/workflows/agent-fix-window-region-kind-v12.yml

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/window-region-clipping-v12-source
          fetch-depth: 0

      - name: Correct the outer-frame preservation expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/platform_win32/src/window_region.rs')
          text = path.read_text(encoding='utf-8')
          old = '        assert_eq!(region, Rect::new(10, 110, 810, 1080));'
          new = '        assert_eq!(region, Rect::new(0, 110, 820, 1090));'
          if text.count(old) != 1:
              raise SystemExit('unexpected vertical clipping test expectation')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Commit the focused correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/platform_win32/src/window_region.rs
          git commit -m 'test: preserve unclipped outer frame at vertical bounds'
          git push origin HEAD:refs/heads/agent/window-region-clipping-v12-source
