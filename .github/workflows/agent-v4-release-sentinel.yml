name: Verify v4 performance release

on:
  push:
    branches:
      - agent/performance-audit-03
    paths:
      - .github/workflows/agent-v4-release-sentinel.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for and verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if gh release view v0.2.6-sehoon.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v0.2.6-sehoon.4 exists"
              exit 0
            fi
            sleep 30
          done
          echo "v0.2.6-sehoon.4 was not published within 20 minutes" >&2
          exit 1
