name: Publish compositor-safe v6

on:
  push:
    branches:
      - agent/fix-compositor-desync-v6
    paths:
      - .github/workflows/agent-publish-compositor-safe-v6.yml

permissions:
  contents: write

concurrency:
  group: publish-compositor-safe-v6
  cancel-in-progress: false

env:
  SOURCE_SHA: 2dfab51243a5cffa4f34bb4bd3f19e10280757f8
  RELEASE_TAG: v0.2.6-sehoon.6
  RELEASE_VERSION: 0.2.6-sehoon.6

jobs:
  verify-build-package-release:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out exact verified source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify source identity and compositor-safe structure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Source identity mismatch: expected=$env:SOURCE_SHA actual=$actual"
          }
          @'
          from pathlib import Path

          config = Path('crates/daemon/src/config.rs').read_text(encoding='utf-8')
          transitions = Path('crates/daemon/src/transitions.rs').read_text(encoding='utf-8')
          layout_apply = Path('crates/daemon/src/layout_apply.rs').read_text(encoding='utf-8')
          placement = Path('crates/platform_win32/src/placement.rs').read_text(encoding='utf-8')
          thumbnail = Path('crates/platform_win32/src/thumbnail.rs').read_text(encoding='utf-8')
          settings = Path('crates/daemon/src/settings/settings.html').read_text(encoding='utf-8')

          assert 'pub compositor_safe_mode: bool' in config
          assert 'compositor_safe_mode: true' in config
          assert 'settle_animations_for_compositor_safety' in transitions
          assert 'if self.settle_animations_for_compositor_safety()' in layout_apply
          assert 'flags |= SWP_NOSIZE' in placement
          assert 'is_compositor_sensitive_class_str' in thumbnail
          assert 'behavior-compositor_safe_mode' in settings
          print('Exact source and compositor-safe invariants verified')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Source invariant verification failed' }

      - name: Install stable Rust with rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify formatting and patch hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt check failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }
          if (git status --porcelain) { throw 'Exact source checkout is unexpectedly dirty' }

      - name: Run full locked test suite for every target
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy for every target with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check every Cargo target
        run: cargo check --workspace --all-targets --locked

      - name: Run optimized library and binary tests
        run: cargo test --workspace --lib --bins --release --locked

      - name: Repeat compositor, scratchpad, floating, and placement regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($iteration in 1..6) {
            foreach ($filter in @('compositor_safe', 'scratchpad', 'floating', 'geometry_mismatch')) {
              cargo test -p leopardwm-daemon --bin leopardwm --release --locked $filter -- --test-threads=1
              if ($LASTEXITCODE -ne 0) {
                throw "$filter regression iteration $iteration failed"
              }
            }
          }

      - name: Build optimized Windows binaries
        run: cargo build --workspace --release --locked

      - name: Verify Windows GUI subsystems
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1

      - name: Install cargo-wix
        run: cargo install cargo-wix --version ^0.3 --locked

      - name: Build and validate MSI installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wixBin = @(
            'C:\Program Files (x86)\WiX Toolset v3.14\bin',
            'C:\Program Files (x86)\WiX Toolset v3.11\bin'
          ) | Where-Object { Test-Path (Join-Path $_ 'candle.exe') } | Select-Object -First 1
          if (-not $wixBin) { throw 'WiX Toolset v3 was not found' }

          cargo wix -p leopardwm-daemon -I wix/main.wxs `
            --target x86_64-pc-windows-msvc `
            --no-build --nocapture `
            --bin-path "$wixBin"
          if ($LASTEXITCODE -ne 0) { throw 'cargo wix failed' }

          $builtMsi = Get-ChildItem target/wix/*.msi | Select-Object -First 1
          if (-not $builtMsi) { throw 'MSI output was not produced' }
          $releaseMsi = "LeopardWM-$env:RELEASE_VERSION-x86_64.msi"
          Copy-Item $builtMsi.FullName $releaseMsi -Force
          if ((Get-Item $releaseMsi).Length -lt 1000000) {
            throw 'MSI is unexpectedly small'
          }

          $adminRoot = Join-Path $env:RUNNER_TEMP 'leopardwm-msi-admin'
          New-Item -ItemType Directory -Path $adminRoot -Force | Out-Null
          $adminLog = Join-Path $env:RUNNER_TEMP 'leopardwm-msi-admin.log'
          $msiPath = (Resolve-Path $releaseMsi).Path
          $arguments = @(
            '/a', "`"$msiPath`"",
            '/qn', "TARGETDIR=`"$adminRoot`"",
            '/l*v', "`"$adminLog`""
          )
          $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content $adminLog -Tail 150 -ErrorAction SilentlyContinue
            throw "MSI administrative installation failed: $($process.ExitCode)"
          }
          foreach ($binary in @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')) {
            if (-not (Get-ChildItem $adminRoot -Recurse -Filter $binary -File)) {
              throw "MSI administrative image is missing $binary"
            }
          }
          "RELEASE_MSI=$releaseMsi" >> $env:GITHUB_ENV
          Write-Host "MSI built and administratively validated: $releaseMsi"

      - name: Package portable release and generate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = @(
            'target/x86_64-pc-windows-msvc/release',
            'target/release'
          ) | Where-Object { Test-Path (Join-Path $_ 'leopardwm.exe') } | Select-Object -First 1
          if (-not $binDir) { throw 'Release binary directory was not found' }

          $packageDir = "LeopardWM-$env:RELEASE_VERSION-x86_64-windows"
          $releaseZip = "$packageDir.zip"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          $binaries = @('leopardwm.exe', 'leopardwm-cli.exe', 'lwm.exe', 'leopardwm-watchdog.exe')
          foreach ($binary in $binaries) {
            $source = Join-Path $binDir $binary
            if (-not (Test-Path $source)) { throw "Missing release binary: $source" }
            Copy-Item $source (Join-Path $packageDir $binary) -Force
            Copy-Item $source $binary -Force
          }
          Copy-Item README.md, LICENSE $packageDir
          Compress-Archive -Path $packageDir -DestinationPath $releaseZip -CompressionLevel Optimal -Force

          $expanded = Join-Path $env:RUNNER_TEMP 'portable-zip-check'
          Expand-Archive -Path $releaseZip -DestinationPath $expanded -Force
          foreach ($binary in $binaries) {
            if (-not (Get-ChildItem $expanded -Recurse -Filter $binary -File)) {
              throw "Portable ZIP is missing $binary"
            }
          }

          $assets = @($releaseZip, $env:RELEASE_MSI) + $binaries
          $checksumLines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash *$asset"
          }
          $checksumLines | Set-Content -Encoding ascii checksums.txt
          "RELEASE_ZIP=$releaseZip" >> $env:GITHUB_ENV
          Get-Content checksums.txt

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          This personal-fork prerelease enables compositor-safe window movement by default.

          Root-cause prevention:
          - all active live-window animations are collapsed at the central frame-dispatch boundary into one exact synchronous landing
          - keyboard focus, mouse focus, workspace switching, drag/drop, and future animation callers therefore share the same protection
          - the asynchronous per-frame SetWindowPos burst that could leave DirectComposition and swap-chain client surfaces offset inside their outer HWND is removed from the default path

          Legacy opt-out hardening:
          - position-only animation frames use SWP_NOSIZE
          - final renderer refresh covers Chromium/Electron, Firefox, Explorer, Terminal, WinUI, WPF/WinForms, CEF, and Qt families
          - failed or timed-out exact landings preserve the pending repair for retry

          Existing configuration remains compatible. Set `behavior.compositor_safe_mode = false` only to opt back into the legacy smooth live-window animation path.
          '@ | Set-Content -Encoding utf8 release-notes-v6.md

      - name: Ensure the release tag is unused
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $remoteTag = @(git ls-remote --tags --refs origin "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check release tag availability: exit $LASTEXITCODE"
          }
          if ($remoteTag.Count -gt 0) {
            throw "Release tag already exists: $env:RELEASE_TAG"
          }
          Write-Host "Release tag is unused: $env:RELEASE_TAG"

      - name: Publish verified ZIP, MSI, and binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create $env:RELEASE_TAG `
            $env:RELEASE_ZIP `
            $env:RELEASE_MSI `
            leopardwm.exe `
            leopardwm-cli.exe `
            lwm.exe `
            leopardwm-watchdog.exe `
            checksums.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SOURCE_SHA `
            --title "LeopardWM $env:RELEASE_TAG — compositor-safe movement" `
            --notes-file release-notes-v6.md `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }

      - name: Independently re-download and verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the published tag' }
          $tagSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($tagSha -ne $env:SOURCE_SHA) {
            throw "Tag/source mismatch: tag=$tagSha source=$env:SOURCE_SHA"
          }

          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --json tagName,isDraft,isPrerelease,targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the published release' }
          if ($release.tagName -ne $env:RELEASE_TAG -or $release.isDraft -or -not $release.isPrerelease) {
            throw 'Published release metadata is invalid'
          }

          $expected = @(
            (Split-Path $env:RELEASE_ZIP -Leaf),
            (Split-Path $env:RELEASE_MSI -Leaf),
            'leopardwm.exe',
            'leopardwm-cli.exe',
            'lwm.exe',
            'leopardwm-watchdog.exe',
            'checksums.txt'
          )
          $actual = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in $expected) {
            if ($name -notin $actual) { throw "Published release is missing $name" }
          }

          $downloadDir = Join-Path $env:RUNNER_TEMP 'published-assets'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $downloadDir
          if ($LASTEXITCODE -ne 0) { throw 'Published assets could not be downloaded' }

          foreach ($name in $expected) {
            $local = Join-Path (Get-Location) $name
            $downloaded = Join-Path $downloadDir $name
            if (-not (Test-Path $downloaded)) { throw "Downloaded release is missing $name" }
            $localHash = (Get-FileHash -Algorithm SHA256 $local).Hash
            $downloadedHash = (Get-FileHash -Algorithm SHA256 $downloaded).Hash
            if ($localHash -ne $downloadedHash) {
              throw "Published asset hash mismatch for $name"
            }
          }

          $report = [ordered]@{
            tag = $env:RELEASE_TAG
            source_sha = $env:SOURCE_SHA
            tag_sha = $tagSha
            target_commitish = $release.targetCommitish
            assets = $actual
            checksums = Get-Content checksums.txt
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 verification-report.json
          Write-Host "Published release and every asset verified at $tagSha"

      - name: Upload verified release bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeopardWM-v0.2.6-sehoon.6-verified
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_MSI }}
            leopardwm.exe
            leopardwm-cli.exe
            lwm.exe
            leopardwm-watchdog.exe
            checksums.txt
            verification-report.json
          if-no-files-found: error
          retention-days: 7
