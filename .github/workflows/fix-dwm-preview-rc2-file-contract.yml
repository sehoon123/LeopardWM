name: Fix DWM preview RC2 file contract

on:
  push:
    branches:
      - control/dwm-preview-proxy-v15
    paths:
      - .github/workflows/fix-dwm-preview-rc2-file-contract.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control/dwm-preview-proxy-v15
          fetch-depth: 0

      - name: Include the retired region backend in the verified product diff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/dwm-preview-proxy-v15-rc2.yml')
          text = path.read_text(encoding='utf-8')

          old_allowed = '''          $allowed = @(
            'crates/platform_win32/src/placement.rs',
            'crates/platform_win32/src/thumbnail.rs'
          )
'''
          new_allowed = '''          $allowed = @(
            'crates/platform_win32/src/placement.rs',
            'crates/platform_win32/src/thumbnail.rs',
            'crates/platform_win32/src/window_region.rs'
          )
'''
          if text.count(old_allowed) != 1:
              raise SystemExit('allowed-file block mismatch')
          text = text.replace(old_allowed, new_allowed, 1)

          old_count = '$changed.Count -ne 2'
          if text.count(old_count) != 1:
              raise SystemExit('changed-file count marker mismatch')
          text = text.replace(old_count, '$changed.Count -ne 3', 1)

          old_add = 'git add crates/platform_win32/src/placement.rs crates/platform_win32/src/thumbnail.rs'
          new_add = old_add + ' crates/platform_win32/src/window_region.rs'
          if text.count(old_add) != 1:
              raise SystemExit('source commit file list mismatch')
          text = text.replace(old_add, new_add, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Commit the corrected release contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/dwm-preview-proxy-v15-rc2.yml
          git commit -m 'ci: verify the retired region backend with DWM proxy source'
          git push origin HEAD:refs/heads/control/dwm-preview-proxy-v15
